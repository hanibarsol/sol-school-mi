  /* measure the glyph itself rather than trusting font metrics */
  function fitClefs(){
    Array.prototype.forEach.call(clefsEl.querySelectorAll(".clefIcon"), function(s){
      var t = s.querySelector("text");
      if(!t){ return; }
      var bb;
      try{ bb = t.getBBox(); }catch(err){ return; }
      if(!bb || !bb.width || !bb.height){ return; }
      var pad = bb.height * 0.04;
      s.setAttribute("viewBox",
        (bb.x - pad) + " " + (bb.y - pad) + " " +
        (bb.width + pad * 2) + " " + (bb.height + pad * 2));
    });
  }
  /* the glyph moves when the music font finishes loading — measure again then */
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(fitClefs).catch(function(){});
  }

  function openNameBox(){

  /* ---------------- the games ----------------
     One screen and no devices: a child points, Hani clicks. Every game note is
     a bare black quarter, so position is the only clue there is. */
  var scoreEl = document.getElementById("score");
  var btnG1 = document.getElementById("btnG1");
  var btnG2 = document.getElementById("btnG2");
  /* Five brand colours, five possible teams. A child should be able to find
     their score by colour alone, so a team never shares a colour. */
  var TEAM_HEX = {blue:"#3B6BB2", amber:"#F2A412", purple:"#43225A", red:"#CC3717", teal:"#189E8A"};
  var TEAM_DEFS = [
    {name:"כְּחֻלָּה", cls:"blue"},
    {name:"כְּתֻמָּה", cls:"amber"},
    {name:"סְגֻלָּה",  cls:"purple"},
    {name:"אֲדֻמָּה",  cls:"red"},
    {name:"יְרֻקָּה",  cls:"teal"}
  ];
  var teams = [0, 0, 0, 0, 0], turn = 0;   /* one team per brand colour */
  var teamRow = document.getElementById("teamRow");
  var gameId = null, isDo = false, isWhole = false, answered = false, savedRow = 0, findRight = 0;
  var answers = [];          /* what each team said, before anyone is told */
  var groupMode = false;     /* off: ask one team. on: ask them all at once */
  var picks = [];            /* in "find", the note each team chose */
  var pickTurn = 0;
  /* רה sits half a space from דו — too fine a distinction for a first lesson */
  var DECOYS = ["do", "re", "fa", "sol", "la", "si"].filter(function(k){ return k !== LESSON; });

  function paintScore(){
    teamRow.innerHTML = "";
    teams.forEach(function(scoreVal, i){
      var d = TEAM_DEFS[i];
      var b = document.createElement("button");
      b.type = "button";
      b.className = "team " + d.cls + (i === turn ? " up" : "");
      var nm = document.createElement("span");
      nm.textContent = d.name;
      var num = document.createElement("span");
      num.className = "tnum";
      num.textContent = scoreVal;
      b.appendChild(nm);
      b.appendChild(num);
      b.addEventListener("click", function(){ turn = i; paintScore(); });
      teamRow.appendChild(b);
    });
    document.getElementById("teamMinus").disabled = teams.length <= 2;
    document.getElementById("teamPlus").disabled  = teams.length >= TEAM_DEFS.length;
    saveState();
  }

  document.getElementById("teamPlus").addEventListener("click", function(){
    if(teams.length >= TEAM_DEFS.length){ return; }
    teams.push(0);
    paintScore();
  });
  document.getElementById("teamMinus").addEventListener("click", function(){
    if(teams.length <= 2){ return; }
    teams.pop();
    if(turn >= teams.length){ turn = 0; }
    paintScore();
  });

  function clearStage(){ gNotes.innerHTML = ""; noteEls = []; }

  function restoreRow(){
    clearStage();
    while(placed.length){ placed.pop(); }
    for(var i = 0; i < savedRow; i++){
      placed.push({key:LESSON, dur:DUR});
      var g = buildNote(LESSON, xs[i], DUR);
      g.classList.add("on");
      gNotes.appendChild(g);
      noteEls.push(g);
    }
    resetRun();
  }

  /* a bare quarter that drops in, with the character kept back */
  function dropGameNote(key, x, pickable, value){
    var g = buildNote(key, x, value || DUR);
    g.classList.add("plain");
    if(pickable){ g.classList.add("pick"); }
    gNotes.appendChild(g);
    noteEls.push(g);
    void g.getBBox();
    requestAnimationFrame(function(){ g.classList.add("on"); });
    return g;
  }

  function enterGames(){
    stopMusic();
    markDone("btnPlay");
    stopClicker();
    closePiano();
    savedRow = placed.length;
    clearStage();
    gameId = null;
    app.dataset.mode = "game";
    delete app.dataset.game;
    delete app.dataset.answered;
    btnG1.classList.remove("live");
    btnG2.classList.remove("live");
    document.getElementById("btnG3").classList.remove("live");
    document.getElementById("btnG4").classList.remove("live");
    clearPeek();
    eyebrow.textContent = "מְשַׂחֲקִים";
    headline.textContent = "בּוֹאוּ נְשַׂחֵק";
    paintScore();
  }
  function exitGames(){
    gameId = null;
    delete app.dataset.verdict;
    delete app.dataset.mode;
    delete app.dataset.game;
    delete app.dataset.answered;
    btnG1.classList.remove("live");
    btnG2.classList.remove("live");
    document.getElementById("btnG3").classList.remove("live");
    document.getElementById("btnG4").classList.remove("live");
    clearPeek();
    eyebrow.textContent = EYEBROW_HOME;
    restoreRow();
    headline.textContent = savedRow ? NOTES[LESSON].he : "מִי מַגִּיעַ לַחַמְשָׁה?";
    setStep(savedRow ? 1 : 0);
  }
  function inGame(){ return app.dataset.mode === "game"; }

  /* Confetti on a right answer. Canvas rather than a hundred DOM nodes, so it
     stays smooth on whatever machine the classroom has. */
  var confEl = document.getElementById("confetti");
  var confCtx = confEl.getContext("2d");
  var confRaf = 0;
  var CONF_COLOURS = ["#43225A", "#F2A412", "#3B6BB2", "#CC3717", "#189E8A"];

  function confetti(){
    if(reduce){ return; }
    confEl.width = window.innerWidth;
    confEl.height = window.innerHeight;
    var bits = [];
    for(var i = 0; i < 130; i++){
      bits.push({
        x: Math.random() * confEl.width,
        y: -30 - Math.random() * confEl.height * 0.5,
        w: 9 + Math.random() * 11,
        h: 14 + Math.random() * 18,
        vx: -70 + Math.random() * 140,
        vy: 150 + Math.random() * 260,
        rot: Math.random() * Math.PI * 2,
        vr: -5 + Math.random() * 10,
        c: CONF_COLOURS[i % CONF_COLOURS.length]
      });
    }
    if(confRaf){ cancelAnimationFrame(confRaf); }
    var last = Date.now(), t0 = last;
    (function step(){
      var now = Date.now(), dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      confCtx.clearRect(0, 0, confEl.width, confEl.height);
      var alive = false;
      for(var i = 0; i < bits.length; i++){
        var b = bits[i];
        b.vy += 300 * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.rot += b.vr * dt;
        if(b.y < confEl.height + 60){ alive = true; }
        confCtx.save();
        confCtx.translate(b.x, b.y);
        confCtx.rotate(b.rot);
        confCtx.fillStyle = b.c;
        confCtx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        confCtx.restore();
      }
      if(alive && now - t0 < 4000){ confRaf = requestAnimationFrame(step); }
      else {
        confCtx.clearRect(0, 0, confEl.width, confEl.height);
        confRaf = 0;
      }
    })();
  }

  function award(ok){
    if(ok){ teams[turn]++; cheer(); confetti(); }
    else { buzz(); }
    turn = (turn + 1) % teams.length;   /* the next team gets the next question */
    paintScore();
    saveState();
  }

  /* ---- game 1: is this דו? ---- */
  function roundYesNo(){
    clearStage();
    answered = false;
    delete app.dataset.answered;
    delete app.dataset.verdict;
    isDo = Math.random() < 0.5;
    var key = isDo ? LESSON : DECOYS[Math.floor(Math.random() * DECOYS.length)];
    dropGameNote(key, gameX, false);
    headline.textContent = "הַאִם זֶה " + NOTES[LESSON].he + "?";
    answers = teams.map(function(){ return null; });
    paintAnswers();
  }

  function paintAnswers(){
    var box = document.getElementById("answers");
    box.innerHTML = "";
    /* one team at a time, or all of them */
    var list = groupMode ? teams.map(function(_, i){ return i; }) : [turn];
    list.forEach(function(i){
      var d = TEAM_DEFS[i];
      var card = document.createElement("div");
      card.className = "acard " + d.cls
        + (groupMode && gameId === "find" && i === pickTurn && !answered ? " picking" : "");

      var nm = document.createElement("span");
      nm.className = "aname";
      nm.textContent = d.name;
      card.appendChild(nm);

      if(gameId === "find"){
        /* in this game a team chooses a note, so the card just reports it */
        var p = document.createElement("span");
        p.className = "apick";
        p.textContent = (picks[i] === null || picks[i] === undefined) ? "—" : String(picks[i] + 1);
        card.appendChild(p);
      } else {
        var row = document.createElement("div");
        row.className = "abtns";
        var choices = (gameId === "value" || gameId === "peek")
          ? [["רֶבַע", false], ["שָׁלֵם", true]]
          : [["כֵּן", true], ["לֹא", false]];
        choices.forEach(function(pair){
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = pair[0];
          b.setAttribute("aria-pressed", answers[i] === pair[1] ? "true" : "false");
          b.addEventListener("click", function(){
            if(answered){ return; }
            answers[i] = pair[1];
            if(groupMode){ paintAnswers(); }
            else { sendAnswer(); }    /* one team asked, one answer, done */
          });
          row.appendChild(b);
        });
        card.appendChild(row);
      }

      var mark = svg("svg", {"class":"amark", viewBox:"0 0 24 24"});
      mark.appendChild(svg("circle", {cx:12, cy:12, r:11}));
      mark.appendChild(svg("path", {"class":"m-ok", d:"M6.5 12.5 L10.5 16.5 L17.5 8"}));
      var no = svg("g", {"class":"m-no"});
      no.appendChild(svg("line", {x1:8, y1:8, x2:16, y2:16}));
      no.appendChild(svg("line", {x1:16, y1:8, x2:8, y2:16}));
      mark.appendChild(no);
      card.appendChild(mark);
      card.dataset.team = i;

      box.appendChild(card);
    });
  }

  /* the dots under each note, showing which team chose it */
  function paintPicks(){
    noteEls.forEach(function(el, idx){
      var old = el.querySelector(".picks");
      if(old){ old.parentNode.removeChild(old); }
      var mine = [];
      picks.forEach(function(p, t){ if(p === idx){ mine.push(t); } });
      if(!mine.length){ return; }
      var g = svg("g", {"class":"picks"});
      var step = 46, x0 = -((mine.length - 1) * step) / 2;
      mine.forEach(function(t, k){
        g.appendChild(svg("circle", {"class":"pickdot",
          cx:x0 + k * step, cy:R + 62, r:18, fill:TEAM_HEX[TEAM_DEFS[t].cls]}));
      });
      el.querySelector(".pulse").appendChild(g);
    });
  }

  function markCards(correctFn){
    var cards = document.querySelectorAll("#answers .acard");
    var anyRight = false;
    Array.prototype.forEach.call(cards, function(card){
      var i = Number(card.dataset.team);
      card.classList.add("sent");
      var verdict = correctFn(i);
      if(verdict === null){ return; }
      if(verdict){ teams[i]++; anyRight = true; card.classList.add("ok"); }
      else { card.classList.add("no"); }
    });
    paintScore();
    return anyRight;
  }

  function sendYesNo(){
    if(answered || gameId !== "yesno" || !noteEls.length){ return; }
    var given = answers.filter(function(a){ return a !== null; }).length;
    if(!given){ flash("עוֹד לֹא סִימַנְתֶּן תְּשׁוּבָה"); return; }

    answered = true;
    app.dataset.answered = "1";

    var anyRight = markCards(function(i){
      return answers[i] === null || answers[i] === undefined ? null : (answers[i] === isDo);
    });
    if(!groupMode){ turn = (turn + 1) % teams.length; }

    var g = noteEls[0];
    if(isDo){
      g.classList.add("open", "right", "blink");
      tone(NOTES[LESSON].freq, 1.2);
      headline.textContent = "זֶה " + NOTES[LESSON].he;
    } else {
      g.classList.add("wrong", "xed");
      /* and this is where דו actually lives */
      var ghost = buildNote(LESSON, ghostX, DUR);
      gNotes.appendChild(ghost);
      void ghost.getBBox();
      requestAnimationFrame(function(){ ghost.classList.add("on"); });
      headline.textContent = "זֶה לֹא " + NOTES[LESSON].he + (FEMININE[LESSON] ? " — הִיא גָּרָה כָּאן" : " — הוּא גָּר כָּאן");
      setTimeout(function(){
        ghost.classList.add("right", "blink");
        tone(NOTES[LESSON].freq, 1.2);
      }, 500);
    }
    if(anyRight){ cheer(); confetti(); } else { buzz(); }
    saveState();
  }

  /* ---- and the same, for choosing a note ---- */
  function sendFind(){
    if(answered || gameId !== "find"){ return; }
    var given = picks.filter(function(p){ return p !== null && p !== undefined; }).length;
    if(!given){ flash("עוֹד לֹא בָּחַרְתֶּן תָּו"); return; }

    answered = true;
    app.dataset.answered = "1";

    var anyRight = markCards(function(i){
      return (picks[i] === null || picks[i] === undefined) ? null : (picks[i] === findRight);
    });

    noteEls.forEach(function(el, idx){
      el.classList.remove("pick");
      if(idx === findRight){ el.classList.add("open", "right", "blink"); }
      else if(picks.indexOf(idx) !== -1){ el.classList.add("wrong", "xed"); }
    });
    tone(NOTES[LESSON].freq, 1.2);
    headline.textContent = anyRight ? "נָכוֹן!" : "זֶה הָיָה כָּאן";
    if(anyRight){ cheer(); confetti(); } else { buzz(); }
    saveState();
  }

  /* ---- game 2: where is דו? ---- */
  function roundFind(){
    clearStage();
    answered = false;
    delete app.dataset.answered;
    delete app.dataset.verdict;
    var count = Math.max(3, Math.min(4, xs.length));
    var right = Math.floor(Math.random() * count);
    findRight = right;
    picks = teams.map(function(){ return null; });
    pickTurn = 0;
    var pool = DECOYS.slice();
    for(var i = 0; i < count; i++){
      var key = LESSON;
      if(i !== right){
        var j = Math.floor(Math.random() * pool.length);
        key = pool.splice(j, 1)[0] || DECOYS[0];
      }
      var g = dropGameNote(key, xs[i], true);
      (function(el, idx, correct){
        el.addEventListener("pointerdown", function(e){
          e.preventDefault();
          if(answered){ return; }

          if(groupMode){
            /* this note is the answer of whichever team is choosing now */
            picks[pickTurn] = idx;
            var next = pickTurn;
            for(var k = 1; k <= teams.length; k++){
              var c = (pickTurn + k) % teams.length;
              if(picks[c] === null){ next = c; break; }
            }
            pickTurn = next;
            paintPicks();
            paintAnswers();
            return;
          }

          if(correct){
            answered = true;
            app.dataset.answered = "1";
            el.classList.remove("pick");
            el.classList.add("open", "right", "blink");
            app.dataset.verdict = "ok";
            tone(NOTES[LESSON].freq, 1.2);
            headline.textContent = "נָכוֹן!";
            award(true);
          } else {
            /* crossed out and out of play, so the next guess narrows it for real */
            el.classList.remove("pick");
            el.classList.add("wrong", "xed");
            app.dataset.verdict = "no";
            buzz();
            headline.textContent = "לֹא נָכוֹן — נַסּוּ שׁוּב";
            setTimeout(function(){ el.classList.remove("wrong"); }, 750);
          }
        });
      })(g, i, i === right);
    }
    headline.textContent = "אֵיפֹה " + NOTES[LESSON].he + "?";
    paintAnswers();
  }

  /* ---- game 4: the same question, behind a curtain ---- */
  var peekG = document.getElementById("peek");
  var peekTiles = [], peekTimer = null;

  function buildPeek(){
    peekG.innerHTML = "";
    peekTiles = [];
    var noteY = STEP_Y[LESSON];
    var top = Math.max(40, noteY - STEM_LEN - 70);
    var bottom = Math.min(1072, noteY + R * WHOLE_SCALE + 80);
    var left = gameX - 170, wide = 340, tall = bottom - top;
    var cols = 5, rows = 8;
    var tw = wide / cols, th = tall / rows;
    var hues = ["blue", "amber", "purple", "red", "teal"];
    for(var r = 0; r < rows; r++){
      for(var c = 0; c < cols; c++){
        var t = svg("rect", {"class":"tile",
          x: left + c * tw + 3, y: top + r * th + 3,
          width: tw - 6, height: th - 6, rx: 9,
          fill: TEAM_HEX[hues[(r + c) % hues.length]]});
        peekG.appendChild(t);
        peekTiles.push(t);
      }
    }
  }

  function runPeek(){
    clearInterval(peekTimer);
    peekTimer = setInterval(function(){
      if(!peekTiles.length){ clearInterval(peekTimer); peekTimer = null; return; }
      var i = Math.floor(Math.random() * peekTiles.length);
      var t = peekTiles.splice(i, 1)[0];
      t.classList.add("gone");
      setTimeout(function(){ if(t.parentNode){ t.parentNode.removeChild(t); } }, 300);
    }, 190);
  }

  function freezePeek(){
    clearInterval(peekTimer);
    peekTimer = null;
    app.dataset.frozen = "1";
    headline.textContent = "רֶבַע אוֹ שָׁלֵם?";
  }

  function clearPeek(){
    clearInterval(peekTimer);
    peekTimer = null;
    peekG.innerHTML = "";
    peekTiles = [];
    delete app.dataset.frozen;
  }

  function roundPeek(){
    clearStage();
    clearPeek();
    answered = false;
    delete app.dataset.answered;
    delete app.dataset.verdict;
    isWhole = Math.random() < 0.5;
    dropGameNote(LESSON, gameX, false, isWhole ? "whole" : "quarter");
    buildPeek();
    runPeek();
    headline.textContent = "מָה מִסְתַּתֵּר?";
    answers = teams.map(function(){ return null; });
    paintAnswers();
  }

  /* ---- game 3: is this a quarter or a whole? ---- */
  function roundValue(){
    clearStage();
    answered = false;
    delete app.dataset.answered;
    delete app.dataset.verdict;
    isWhole = Math.random() < 0.5;
    dropGameNote(LESSON, gameX, false, isWhole ? "whole" : "quarter");
    headline.textContent = "רֶבַע אוֹ שָׁלֵם?";
    answers = teams.map(function(){ return null; });
    paintAnswers();
  }

  function sendValue(){
    if(answered || (gameId !== "value" && gameId !== "peek") || !noteEls.length){ return; }
    if(!answers.some(function(a){ return a !== null && a !== undefined; })){
      flash("עוֹד לֹא סִימַנְתֶּן תְּשׁוּבָה"); return;
    }
    answered = true;
    app.dataset.answered = "1";
    clearPeek();                       /* whatever is left of the curtain goes */

    var anyRight = markCards(function(i){
      return (answers[i] === null || answers[i] === undefined) ? null : (answers[i] === isWhole);
    });
    if(!groupMode){ turn = (turn + 1) % teams.length; }

    var g = noteEls[0];
    g.classList.add("open", "right", "blink");
    /* the proof is in the ear: four beats really do last four times as long */
    var beats = isWhole ? 4 : 1;
    tone(NOTES[LESSON].freq, Math.min(3.6, beats * bpmMs / 1000 * HOLD_FRACTION));
    headline.textContent = isWhole
      ? "זֶה שָׁלֵם — אַרְבַּע פְּעִימוֹת"
      : "זֶה רֶבַע — פְּעִימָה אַחַת";

    if(anyRight){ cheer(); confetti(); } else { buzz(); }
    saveState();
  }

  /* whichever game is running, this is the one press that settles it */
  function sendAnswer(){
    if(gameId === "find"){ sendFind(); }
    else if(gameId === "value" || gameId === "peek"){ sendValue(); }
    else { sendYesNo(); }
  }

  function nextRound(){
    clearPeek();
    if(gameId === "yesno"){ roundYesNo(); }
    else if(gameId === "find"){ roundFind(); }
    else if(gameId === "value"){ roundValue(); }
    else if(gameId === "peek"){ roundPeek(); }
  }
  function startGame(id){
    gameId = id;
    app.dataset.game = id;
    btnG1.classList.toggle("live", id === "yesno");
    btnG2.classList.toggle("live", id === "find");
    document.getElementById("btnG3").classList.toggle("live", id === "value");
    document.getElementById("btnG4").classList.toggle("live", id === "peek");
    nextRound();
  }

  Array.prototype.forEach.call(document.querySelectorAll(".kbmode button"), function(b){
    b.addEventListener("click", function(){ setPianoMode(b.dataset.pm); });
  });
  document.getElementById("btnAgain").addEventListener("click", function(){
    resetRun();
    drawWire();
  });
  document.getElementById("btnPlay").addEventListener("click", enterGames);
  btnG1.addEventListener("click", function(){ startGame("yesno"); });
  btnG2.addEventListener("click", function(){ startGame("find"); });
  document.getElementById("btnG3").addEventListener("click", function(){ startGame("value"); });
  document.getElementById("btnG4").addEventListener("click", function(){ startGame("peek"); });
  document.getElementById("btnFreeze").addEventListener("click", freezePeek);
  document.getElementById("btnSend").addEventListener("click", sendAnswer);
  document.getElementById("btnGroup").addEventListener("click", function(){
    groupMode = !groupMode;
    if(groupMode){ app.dataset.group = "1"; } else { delete app.dataset.group; }
    this.classList.toggle("live", groupMode);
    this.classList.toggle("dim", !groupMode);
    saveState();
    if(gameId){ nextRound(); }      /* a fresh question, asked the new way */
  });
  document.getElementById("btnNext").addEventListener("click", nextRound);
  document.getElementById("btnGameExit").addEventListener("click", exitGames);
  paintScore();

  /* ---------------- a new class ----------------
     Scores, the good-word collection, the staff and every mode, back to zero. */
  var newClassBtn = document.getElementById("btnNewClass");
  var newClassArmed = false, newClassTimer = null;

  function disarmNewClass(){
    newClassArmed = false;
    clearTimeout(newClassTimer);
    newClassBtn.classList.remove("armed");
    newClassBtn.textContent = "כִּתָּה חֲדָשָׁה";
  }

  function newClass(){
    if(inGame()){ exitGames(); }
    if(inDraw()){ exitDraw(); }
    stopClicker();
    closePiano();

    teams = [0, 0, 0, 0, 0];
    turn = 0;
    paintScore();

    roll = [];
    paintRoll();
    hudEl.classList.remove("open");
    cheerEl.classList.remove("show");

    gNotes.innerHTML = "";
    noteEls = [];
    while(placed.length){ placed.pop(); }
    savedRow = 0;
    resetRun();
    if(targetKeyEl){ targetKeyEl.classList.remove("earned", "again"); }

    delete app.dataset.verdict;
    clearDone();
    try{ window.sessionStorage.removeItem(SAVE_KEY); }catch(err){}
    headline.textContent = "מִי מַגִּיעַ לַחַמְשָׁה?";
    btnReveal.textContent = "מִי הַתָּו הֶחָדָשׁ?";
    eyebrow.textContent = EYEBROW_HOME;
    setStep(0);
    disarmNewClass();
  }

  newClassBtn.addEventListener("click", function(){
    if(!newClassArmed){
      newClassArmed = true;
      newClassBtn.classList.add("armed");
      newClassBtn.textContent = "בְּטוּחָה? לַחֲצוּ שׁוּב";
      clearTimeout(newClassTimer);
      newClassTimer = setTimeout(disarmNewClass, 4000);
      return;
    }
    newClass();
  });

  /* ---------------- surviving a reload ---------------- */
  var SAVE_KEY = "sol-school:" + LESSON + ":v1";
  var saveTimer = null;

  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{
        var done = [];
        ["btnSong","btnVideo","btnReveal","btnClick","btnPiano","btnDraw","btnPlay"]
          .forEach(function(id){
            var b = document.getElementById(id);
            if(b && b.classList.contains("done")){ done.push(id); }
          });
        window.sessionStorage.setItem(SAVE_KEY, JSON.stringify({
          v: 1,
          teams: teams,
          turn: turn,
          roll: roll,
          notes: placed.map(function(p){ return {key:p.key, dur:p.dur}; }),
          done: done,
          value: DUR,
          group: groupMode,
          pmode: pianoMode,
          bpm: bpmMs,
          star: !!(targetKeyEl && targetKeyEl.classList.contains("earned"))
        }));
      }catch(err){}   /* private windows and blocked storage simply do without */
    }, 120);
  }

  function restoreState(){
    var raw = null;
    try{ raw = window.sessionStorage.getItem(SAVE_KEY); }catch(err){ return; }
    if(!raw){ return; }
    var s;
    try{ s = JSON.parse(raw); }catch(err){ return; }
    if(!s || s.v !== 1){ return; }

    if(Array.isArray(s.teams) && s.teams.length >= 2){ teams = s.teams; }
    if(typeof s.turn === "number" && s.turn < teams.length){ turn = s.turn; }
    paintScore();

    if(Array.isArray(s.roll)){ roll = s.roll; paintRoll(); }

    if(s.group){
      groupMode = true;
      app.dataset.group = "1";
      var gb = document.getElementById("btnGroup");
      gb.classList.add("live");
      gb.classList.remove("dim");
    }
    if(s.pmode === "play" || s.pmode === "write"){
      pianoMode = s.pmode;
      Array.prototype.forEach.call(document.querySelectorAll(".kbmode button"), function(b){
        b.setAttribute("aria-pressed", b.dataset.pm === pianoMode ? "true" : "false");
      });
    }
    if(s.value){ DUR = s.value; }
    Array.prototype.forEach.call(document.querySelectorAll("#value button"), function(b){
      b.setAttribute("aria-pressed", b.dataset.val === DUR ? "true" : "false");
    });
    if(s.bpm){ bpmMs = s.bpm; }
    Array.prototype.forEach.call(document.querySelectorAll(".tempo:not(#value) button"), function(b){
      b.setAttribute("aria-pressed", Number(b.dataset.bpm) === bpmMs ? "true" : "false");
    });

    if(Array.isArray(s.notes) && s.notes.length){
      gNotes.innerHTML = "";
      noteEls = [];
      while(placed.length){ placed.pop(); }
      s.notes.slice(0, xs.length).forEach(function(p, i){
        if(!STEP_Y[p.key]){ return; }
        placed.push({key:p.key, dur:p.dur});
        var g = buildNote(p.key, xs[i], p.dur);
        g.classList.add("on");
        gNotes.appendChild(g);
        noteEls.push(g);
      });
      if(placed.length){
        headline.textContent = NOTES[placed[0].key].he;
        btnReveal.textContent = "הוֹסָפַת הַתָּו";
        setStep(1);
      }
      resetRun();
    }

    if(Array.isArray(s.done)){ s.done.forEach(markDone); }
    if(s.star && targetKeyEl){ targetKeyEl.classList.add("earned"); }
  }

  /* one touch, three jobs: wake the sound, say so if the device refuses,
     and get out of the way */
  (function(){
    var gate = document.getElementById("gate");
    var btn = document.getElementById("gateBtn");
    function open(){
      var c = null;
      try{ c = audio(); }catch(err){}
      gate.classList.add("gone");           /* the lesson opens either way */
      if(!c){ return; }
      /* the engine needs a moment; only a second later is silence real silence */
      setTimeout(function(){
        if(c.state !== "running"){
          flash("הַמַּכְשִׁיר בְּמַצַּב שָׁקֵט. כַּבּוּ אוֹתוֹ וְהַגְבִּירוּ אֶת הָעָצְמָה");
        }
      }, 1000);
    }
    btn.addEventListener("click", open);
    gate.addEventListener("touchstart", function(e){ if(e.cancelable){ e.preventDefault(); } open(); }, {passive:false});
  })();

  window.addEventListener("resize", layout);

  buildKeyboard();
  layout();
  restoreState();   /* a reload should cost the class nothing */
})();
</script>
