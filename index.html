<title>מִי עַל הַחַמְשָׁה</title>
<meta name="robots" content="noindex, nofollow">   <!-- not for finding by accident in a search -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Heebo:wght@400;500;700;900&family=Noto+Music&display=swap">

<style>
  :root{
    /* Hani's brand palette. Nothing outside this list, white and black. */
    --purple:#43225A;
    --amber:#F2A412;
    --blue:#3B6BB2;
    --red:#CC3717;
    --teal:#189E8A;
    --white:#FFFFFF;
    --ink:#000000;

    /* neutrals: grey sits with white and black, it carries no meaning */
    --text:#16222E;
    --text-soft:#5B6B7A;
    --hair:#DCE4EB;
    --chrome:#F1F5F8;
    --fill:#B3BEC6;             /* the window inside a filled head — grey, not white */

    /* each brand colour has exactly one job */
    --head:var(--ink);          /* a filled notehead — one beat */
    --now:var(--blue);          /* the beat ring and the wire to the piano */
    --now-deep:var(--purple);   /* the name of the note */
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--white);
    color:var(--text);
    font-family:"Heebo","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  #app{
    direction:rtl;
    height:100dvh;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto auto;
    background:var(--white);
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    padding:clamp(.5rem,1.4vh,1.1rem) clamp(1rem,3vw,2.6rem) 0;
  }
  .head-text{display:flex;flex-direction:column;gap:.1rem;min-width:0;}
  .head-line{display:flex;align-items:center;gap:.5rem;min-width:0;}

  /* the verdict on the answer — never on the note */
  #verdictMark{
    display:none;flex:0 0 auto;
    width:clamp(1.7rem,4.2vw,3.2rem);height:clamp(1.7rem,4.2vw,3.2rem);
  }
  #app[data-verdict] #verdictMark{display:block;animation:vpop .38s cubic-bezier(.2,1.6,.4,1);}
  #verdictMark path,#verdictMark line{
    fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;
  }
  #verdictMark .v-ok{stroke:var(--teal);}
  #verdictMark .v-no line{stroke:var(--red);}
  #app[data-verdict="ok"] #verdictMark .v-no{display:none;}
  #app[data-verdict="no"] #verdictMark .v-ok{display:none;}
  @keyframes vpop{
    from{transform:scale(.4);opacity:0;}
    to  {transform:none;opacity:1;}
  }

  /* ---------- the good-word collection ----------
     One clef for one child, kept on screen all lesson, in the corner
     children already watch for a score. */
  #hud{
    position:relative;
    display:flex;align-items:center;flex-wrap:wrap;
    gap:.35rem;
    max-width:44vw;
    background:var(--teal);
    border-radius:24px;
    padding:.45rem .6rem;
    cursor:pointer;
    transition:opacity .25s ease;
  }
  #hud.empty{opacity:.42;}
  #hudLabel{
    font-family:"Fredoka","Heebo",sans-serif;font-weight:600;
    font-size:clamp(.72rem,1.25vw,1.05rem);
    color:var(--white);padding-inline:.3rem;white-space:nowrap;
  }
  #clefs{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;}
  .chip{
    width:var(--cs,34px);
    height:calc(var(--cs,34px) * 1.34);
    border-radius:calc(var(--cs,34px) * .28);
    background:var(--white);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;flex:0 0 auto;
    box-shadow:0 2px 0 rgba(0,0,0,.2);
  }
  .chip .clefIcon{width:72%;height:84%;display:block;overflow:visible;}
  .chip .clefIcon text{
    font-family:"Noto Music","Segoe UI Symbol",serif;
    font-size:100px;fill:var(--ink);
  }
  .chip.add{
    border:none;padding:0;cursor:pointer;
    background:var(--white);
    transition:transform .12s ease;
  }
  .chip.add svg{width:56%;height:56%;fill:var(--teal);}
  .chip.add:hover{transform:scale(1.08);}
  .chip.add:hover svg{fill:var(--purple);}
  .chip.add:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}
  #hud.empty{opacity:.55;}
  #hud.empty .chip.add svg{fill:var(--purple);}

  .chip.new{animation:chipIn .55s cubic-bezier(.2,1.6,.4,1);}
  @keyframes chipIn{
    from{transform:scale(2);opacity:0;}
    to  {transform:none;opacity:1;}
  }

  /* centred on the screen, never against an edge, and free to wrap */
  #confetti{
    position:fixed;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:66;
  }

  #cheer{
    position:fixed;
    top:clamp(4.6rem,13vh,8.5rem);
    left:50%;
    transform:translateX(-50%) translateY(-12px);
    background:var(--purple);color:var(--white);
    font-family:"Fredoka","Heebo",sans-serif;font-weight:600;
    font-size:clamp(1.1rem,2.6vw,2.2rem);line-height:1.25;
    padding:.5em 1.3em;border-radius:999px;
    max-width:min(92vw,58rem);text-align:center;text-wrap:balance;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
    z-index:75;
  }
  #cheer.show{opacity:1;transform:translateX(-50%) translateY(0);}

  #roster{
    display:none;position:absolute;top:calc(100% + .45rem);inset-inline-start:0;
    background:var(--white);border:3px solid var(--teal);border-radius:16px;
    padding:.7rem .9rem;min-width:13rem;max-height:44vh;overflow:auto;
    text-align:start;z-index:6;cursor:default;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
  }
  #hud.open #roster{display:block;}
  #roster h2{
    margin:0 0 .4rem;font-family:"Fredoka","Heebo",sans-serif;font-weight:600;
    font-size:clamp(.9rem,1.5vw,1.15rem);color:var(--teal);
  }
  #roster ol{margin:0;padding-inline-start:1.2rem;font-size:clamp(.85rem,1.4vw,1.1rem);line-height:1.7;}
  #roster li{display:flex;align-items:center;justify-content:space-between;gap:.8rem;}
  #roster .drop{
    flex:0 0 auto;border:none;background:none;cursor:pointer;
    color:var(--red);font-size:1em;line-height:1;padding:.15em .3em;border-radius:8px;
  }
  #roster .drop:hover{background:var(--red);color:var(--white);}
  #roster .reset{
    margin-top:.6rem;font-family:"Fredoka","Heebo",sans-serif;font-weight:600;
    font-size:clamp(.78rem,1.2vw,.98rem);
    background:none;border:none;color:var(--red);cursor:pointer;padding:.2em 0;
  }

  /* ---------- asking who earned it ---------- */
  #namebox{
    position:fixed;inset:0;z-index:80;
    display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);
  }
  #namebox.open{display:flex;}
  .namecard{
    background:var(--white);border-radius:22px;
    padding:clamp(1.2rem,3vh,2rem) clamp(1.4rem,3vw,2.4rem);
    display:flex;flex-direction:column;gap:1rem;align-items:stretch;
    min-width:min(88vw,26rem);
    box-shadow:0 24px 60px rgba(0,0,0,.4);
  }
  .namecard label{
    font-family:"Fredoka","Heebo",sans-serif;font-weight:600;
    font-size:clamp(1.1rem,2.4vw,1.8rem);color:var(--purple);text-align:center;
  }
  #nameInput{
    font-family:"Fredoka","Heebo",sans-serif;font-size:clamp(1.1rem,2.4vw,1.8rem);
    text-align:center;padding:.5em .6em;border:3px solid var(--teal);
    border-radius:14px;color:var(--text);background:var(--white);
  }
  #nameInput:focus{outline:4px solid var(--blue);outline-offset:2px;}
  .namebtns{display:flex;gap:.6rem;justify-content:center;}
  .eyebrow{
    font-weight:700;
    font-size:clamp(.75rem,1.4vw,1.15rem);
    letter-spacing:.08em;
    color:var(--text-soft);
    white-space:nowrap;
  }
  h1#headline{
    margin:0;
    font-family:"Fredoka","Heebo",sans-serif;
    font-weight:600;
    font-size:clamp(1.5rem,4.4vw,3.2rem);
    line-height:1.05;
    text-wrap:balance;
    color:var(--text);
    transition:color .45s ease;
  }
  #app:not([data-step="0"]) h1#headline{color:var(--now-deep);}
  /* the verdict on the class's answer, not on the note */
  #app[data-verdict="ok"] h1#headline{color:var(--teal);}
  #app[data-verdict="no"] h1#headline{color:var(--red);}

  /* ---------- stage ---------- */
  #stage{
    position:relative;
    min-height:0;
    padding:clamp(.2rem,1vh,.8rem) clamp(.4rem,1.5vw,1.4rem);
  }
  #staff{width:100%;height:100%;display:block;}

  .staff-line{stroke:var(--ink);stroke-width:14;}
  /* finer than the staff itself, so it divides without competing */
  #barline{stroke:var(--ink);stroke-width:7;}
  /* the drawing lesson is about the staff and the clef, not about measures */
  #app[data-mode="draw"] #barline{display:none;}
  .ledger{stroke:var(--ink);stroke-width:14;}
  /* Note value is carried by two things, exactly as in real notation:
     whether the head is filled, and whether there is a stem.
       רבע  filled head + stem   → one beat
       חצי  hollow head + stem   → two beats
       שלם  hollow head, no stem → four beats
     The fill is turquoise rather than black so the character stays visible. */
  /* The head is a real filled black notehead, with a white window cut in it
     so the character still lives inside. Hollow values simply lose the fill. */
  .rim{fill:var(--head);stroke:var(--ink);stroke-width:6;}
  .note[data-dur="half"] .rim,
  .note[data-dur="whole"] .rim{fill:var(--white);}
  /* filled values get a grey window, hollow values a white one, so רבע and שלם
     never look alike even from the back row */
  .inner{fill:var(--fill);}
  .note[data-dur="half"] .inner,
  .note[data-dur="whole"] .inner{fill:var(--white);}

  /* the beat made visible: water rises inside the head while the key is held */
  /* Like the dotted letters in a handwriting workbook: the shape waits in dots,
     then a line walks the dots and the note takes shape. No character inside —
     this step is about the shape of the note itself. */
  .trace .tpl{
    fill:none;stroke:var(--fill);stroke-width:7;
    stroke-dasharray:13 15;stroke-linecap:round;
    transition:opacity .4s ease;
  }
  .trace .ink{fill:none;stroke:var(--ink);stroke-linecap:round;}
  .trace .ink.head  {stroke-width:7; stroke-dasharray:545;stroke-dashoffset:545;}
  .trace .ink.ledger{stroke-width:14;stroke-dasharray:266;stroke-dashoffset:266;}
  .trace .ink.stem  {stroke-width:16;stroke-dasharray:460;stroke-dashoffset:460;}
  .trace .solidfill{fill:var(--ink);opacity:0;}

  .trace.go .ink.head  {transition:stroke-dashoffset .85s ease-in-out;      stroke-dashoffset:0;}
  .trace.go .ink.ledger{transition:stroke-dashoffset .35s ease-in-out .85s; stroke-dashoffset:0;}
  .trace.go .ink.stem  {transition:stroke-dashoffset .5s  ease-in-out 1.2s; stroke-dashoffset:0;}
  .trace.go .solidfill {transition:opacity .5s ease 1.75s;opacity:1;}
  .trace.go .tpl       {opacity:0;transition-delay:1.75s;}

  /* which note the piano is waiting for, when several are lined up */
  .note.next .rim{stroke:var(--blue);stroke-width:12;}

  /* where the beat is right now, gliding from note to note at the chosen tempo */
  #playhead{
    stroke:var(--teal);stroke-width:5;stroke-linecap:round;
    opacity:0;transition:opacity .25s ease;pointer-events:none;
  }

  .water{fill:var(--blue);opacity:.42;}
  .water-top{fill:var(--white);opacity:.9;}
  .note.hold-full .rim{stroke:var(--teal);stroke-width:12;}

  .stem{stroke:var(--ink);stroke-width:16;}

  /* ---------- drawing mode ----------
     The projector draws exactly what the class should draw, in order,
     so a seven year old can copy one stroke at a time. */
  /* Every step of the drawing lesson is the same shape twice: a pale guide to
     copy, and then the black marker filling it in, in the order a hand moves. */
  #lines line{stroke-dasharray:var(--w,4000);stroke-dashoffset:0;}
  #app[data-mode="draw"] #lines line{
    stroke-dashoffset:var(--w,4000);
    transition:stroke-dashoffset 1.05s linear;   /* linear, to stay under the marker */
  }

  #guideLines{display:none;}
  #lineNums text{
    font-family:"Fredoka","Heebo",sans-serif;font-weight:600;
    font-size:86px;fill:var(--teal);
    text-anchor:middle;dominant-baseline:central;
    opacity:0;transform:scale(.45);
    transform-box:fill-box;transform-origin:center;
    transition:opacity .25s ease, transform .38s cubic-bezier(.2,1.6,.4,1);
  
    /* sits on its line, not behind it: a white edge keeps the line out of the digit */
    paint-order:stroke;stroke:var(--white);stroke-width:18;stroke-linejoin:round;
  }
  #lineNums text.on{opacity:1;transform:none;}
  #guideLines line{
    stroke:var(--fill);stroke-width:7;
    stroke-dasharray:13 15;stroke-linecap:round;
  }
  #app[data-mode="draw"][data-draw="1"] #guideLines,
  #app[data-mode="draw"][data-draw="2"] #guideLines,
  #app[data-mode="draw"][data-draw="3"] #guideLines{display:block;}
  /* the dotted line to copy, and the black line that fills it in */
  #clefDrawing{display:none;}
  #clefGuidePath{
    fill:none;stroke:var(--fill);stroke-width:9;
    stroke-dasharray:14 18;stroke-linecap:round;
  }
  #clefInk{
    fill:none;stroke:var(--ink);stroke-width:26;
    stroke-linecap:round;stroke-linejoin:round;
  }
  #clefWrap{transition:opacity .45s ease;}
  #app[data-mode="draw"] #clefWrap{opacity:0;}   /* the printed clef waits its turn */

  /* the marker itself */
  #marker{opacity:0;transition:opacity .2s ease;pointer-events:none;}
  #marker.on{opacity:1;}
  #marker path{fill:var(--ink);}
  #marker .body{fill:var(--ink);}
  #marker .grip{fill:var(--teal);}

  #app[data-mode="draw"] #notes{opacity:0;transition:opacity .3s ease;}
  #app[data-mode="draw"][data-draw="3"] #notes{opacity:1;}

  /* ---------- team scoreboard ---------- */
  #score{display:none;gap:.45rem;align-items:center;}
  #app[data-mode="game"] #score{display:flex;}
  #teamRow{
    display:flex;flex-wrap:wrap;gap:.4rem;
    align-items:center;justify-content:center;
    max-width:46vw;
  }
  #app[data-mode="game"] #hud{max-width:18vw;}
  #teamMinus,#teamPlus{
    width:clamp(26px,3.4vh,34px);height:clamp(26px,3.4vh,34px);
    flex:0 0 auto;border:none;border-radius:50%;cursor:pointer;
    background:var(--chrome);display:grid;place-items:center;padding:0;
  }
  #teamMinus svg,#teamPlus svg{width:64%;height:64%;fill:var(--text-soft);}
  #teamMinus:hover,#teamPlus:hover{background:var(--purple);}
  #teamMinus:hover svg,#teamPlus:hover svg{fill:var(--white);}
  #teamMinus[disabled],#teamPlus[disabled]{opacity:.3;cursor:default;}
  #teamMinus[disabled]:hover,#teamPlus[disabled]:hover{background:var(--chrome);}
  #teamMinus[disabled]:hover svg,#teamPlus[disabled]:hover svg{fill:var(--text-soft);}

  .team{
    display:flex;align-items:center;gap:.55rem;
    font-family:"Fredoka","Heebo",sans-serif;font-weight:600;
    font-size:clamp(.75rem,1.25vw,1.05rem);
    border:none;border-radius:999px;cursor:pointer;
    padding:.35em .8em;background:var(--white);
    transition:transform .14s ease,box-shadow .14s ease,background .14s ease;
  }
  .team .tnum{
    font-size:1.5em;line-height:1;min-width:1.4ch;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .team.blue  {color:var(--blue);  box-shadow:inset 0 0 0 3px var(--blue);}
  .team.amber {color:var(--amber); box-shadow:inset 0 0 0 3px var(--amber);}
  .team.purple{color:var(--purple);box-shadow:inset 0 0 0 3px var(--purple);}
  .team.red   {color:var(--red);   box-shadow:inset 0 0 0 3px var(--red);}
  .team.teal  {color:var(--teal);  box-shadow:inset 0 0 0 3px var(--teal);}
  .team.up{box-shadow:none;transform:scale(1.07);}
  .team.blue.up  {background:var(--blue);  color:var(--white);}
  .team.amber.up {background:var(--amber); color:var(--ink);}
  .team.purple.up{background:var(--purple);color:var(--white);}
  .team.red.up   {background:var(--red);   color:var(--white);}
  .team.teal.up  {background:var(--teal);  color:var(--white);}

  /* ---------- game notes ----------
     A game note is a plain black quarter with no character, so where it sits
     is the only clue. Only the right answer opens up. */
  .note.plain .inner,.note.plain .face{opacity:0;}
  .note.plain.open .inner,.note.plain.open .face{opacity:1;transition:opacity .45s ease;}
  /* the curtain */
  .tile{
    transform-box:fill-box;transform-origin:center;
    transition:opacity .26s ease, transform .26s ease;
  }
  .tile.gone{opacity:0;transform:scale(.45) rotate(12deg);}

  .note.plain.pick{cursor:pointer;}
  .note.plain.pick:hover .rim{stroke:var(--blue);stroke-width:12;}
  .note.right .rim{stroke:var(--teal);stroke-width:14;}
  /* the right answer pulses green so the whole room sees where דו lives */
  .note.blink .rim{animation:blinkGreen .6s ease-in-out 4;}
  @keyframes blinkGreen{
    0%,100%{stroke:var(--teal);stroke-width:8;}
    50%    {stroke:var(--teal);stroke-width:20;}
  }
  .xmark{opacity:0;pointer-events:none;}
  .xmark line{stroke:var(--red);stroke-width:17;stroke-linecap:round;}
  .note.xed .xmark{opacity:1;animation:xpop .35s cubic-bezier(.2,1.6,.4,1);}
  @keyframes xpop{
    from{transform:scale(.35);opacity:0;}
    to  {transform:none;opacity:1;}
  }
  .note.wrong .rim{stroke:var(--red);stroke-width:14;}
  .note.wrong .pulse{animation:wobble .45s ease-in-out;}
  @keyframes wobble{
    0%,100%{transform:translateX(0);}
    25%    {transform:translateX(-16px);}
    75%    {transform:translateX(16px);}
  }

  #btnG1,#btnG2,#btnG3,#btnG4,#btnFreeze,#btnSend,#btnNext,#btnGameExit,#btnGroup{display:none;}
  #app[data-mode="game"] #btnSong,
  #app[data-mode="game"] #btnVideo,
  #app[data-mode="game"] #btnReveal,
  #app[data-mode="game"] #btnClear,
  #app[data-mode="game"] #btnClick,
  #app[data-mode="game"] #btnPiano,
  #app[data-mode="game"] #btnDraw,
  #app[data-mode="game"] #btnPlay,
  #app[data-mode="game"] .tempo{display:none;}
  #app[data-mode="game"] #btnG1,
  #app[data-mode="game"] #btnG2,
  #app[data-mode="game"] #btnG3,
  #app[data-mode="game"] #btnG4,
  #app[data-mode="game"] #btnGameExit{display:inline-flex;}
  /* the curtain can be stopped until it is stopped */
  #app[data-game="peek"]:not([data-frozen]):not([data-answered]) #btnFreeze{display:inline-flex;}
  #btnFreeze{background:var(--red);}
  #app[data-game] #btnGroup{display:inline-flex;}
  /* the send button only belongs to the group way of asking */
  #app[data-game][data-group="1"]:not([data-answered]) #btnSend{display:inline-flex;}
  #app[data-game][data-answered="1"] #btnNext{display:inline-flex;}
  #btnSend{background:var(--teal);}

  /* one card per team: their answer, and afterwards their result */
  #answers{display:none;width:100%;gap:.5rem;flex-wrap:wrap;justify-content:center;}
  #app[data-game] #answers{display:flex;}
  .acard{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:.3rem;
    padding:.4rem .7rem .5rem;border-radius:14px;background:var(--white);
  }
  .aname{
    font-family:"Fredoka","Heebo",sans-serif;font-weight:600;
    font-size:clamp(.7rem,1.1vw,.95rem);
  }
  .acard.blue  {box-shadow:inset 0 0 0 3px var(--blue);}
  .acard.amber {box-shadow:inset 0 0 0 3px var(--amber);}
  .acard.purple{box-shadow:inset 0 0 0 3px var(--purple);}
  .acard.red   {box-shadow:inset 0 0 0 3px var(--red);}
  .acard.teal  {box-shadow:inset 0 0 0 3px var(--teal);}
  .acard.blue   .aname{color:var(--blue);}
  .acard.amber  .aname{color:var(--amber);}
  .acard.purple .aname{color:var(--purple);}
  .acard.red    .aname{color:var(--red);}
  .acard.teal   .aname{color:var(--teal);}
  .abtns{display:flex;gap:.25rem;}
  .abtns button{
    font-family:"Fredoka","Heebo",sans-serif;font-weight:600;
    font-size:clamp(.72rem,1.15vw,1rem);
    border:none;border-radius:999px;padding:.28em .8em;cursor:pointer;
    background:var(--chrome);color:var(--text-soft);
    transition:background .14s ease,color .14s ease;
  }
  .abtns button:hover{background:#E3EAF0;color:var(--text);}
  .abtns button[aria-pressed="true"]{background:var(--purple);color:var(--white);}
  .acard.sent .abtns button{cursor:default;}
  /* whose turn it is to choose, while the teams take it in turns */
  .acard.picking{transform:scale(1.06);}
  .acard.picking .aname{text-decoration:underline;}
  .apick{
    font-family:"Fredoka","Heebo",sans-serif;font-weight:600;
    font-size:clamp(.9rem,1.6vw,1.3rem);color:var(--text-soft);
    min-height:1.2em;
  }
  /* the coloured dots under a note, one per team that chose it */
  .pickdot{stroke:var(--white);stroke-width:4;}
  .amark{
    position:absolute;top:-10px;inset-inline-end:-10px;
    width:clamp(22px,2.6vh,30px);height:clamp(22px,2.6vh,30px);display:none;
  }

      {name:"הַשִּׁיר עִם הַדְּמֻיּוֹת", src:"media/song.mp4"},
      {name:"הַדְגָּמָה",              src:"media/demo.mp4"}
    ],
    note: [
      {name:"מִי מַגִּיעָה לַגַּן", src:"media/note.mp4"}
    ]
  };
  var MAXN   = 8;      /* most notes one staff will hold */
  var placed = [];     /* {key, dur} for each note on the staff, in reading order */
  var DUR    = "quarter";  /* what the next note will be: quarter · half · whole */

  /* how long each value lasts. This is the whole idea of the lesson. */
  function beatsOf(p){
    if(!p){ return 1; }
    return p.dur === "whole" ? 4 : p.dur === "half" ? 2 : 1;
  }

  var app      = document.getElementById("app");
  var headline = document.getElementById("headline");
  var stage    = document.getElementById("stage");
  var staff    = document.getElementById("staff");
  var gLines   = document.getElementById("lines");
  var gNotes   = document.getElementById("notes");
  var wire     = document.getElementById("wire");
  var kb       = document.getElementById("kb");
  var hintEl   = document.getElementById("hint");
  var btnReveal= document.getElementById("btnReveal");
  var btnClick = document.getElementById("btnClick");
  var btnPiano = document.getElementById("btnPiano");

  /* the character art: figure bbox inside סול.png is x 321..1026, y 66..1577 of 1280x1600.
     Fit the whole figure inside the circle by height, centred on its own bounding box. */
  /* Hani's art, measured file by file. bbox = the solid figure inside each PNG,
     so every character is centred on itself and not on its empty canvas. */
  var CHARS = {
    "do": {size:[520,650], bbox:[122,37,519,647]},  /* אבא ליד הפסנתר */
    re  : {size:[520,650], bbox:[48,40,414,644]},  /* אמא מציירת */
    mi  : {size:[520,650], bbox:[59,65,428,637]},  /* הילדה עם הבובות */
    fa  : {size:[520,650], bbox:[32,7,473,642]},  /* הילדה עם הקורקינט */
    sol : {size:[520,735], bbox:[122,15,392,702]},  /* הילד בחולצה הכחולה */
    la  : {size:[520,650], bbox:[127,260,387,637]},  /* החתול */
    si  : {size:[520,736], bbox:[52,21,467,734]},  /* הדלת */
  };
  var FILL = 0.98;

  function fitFigure(key, d){
    var c = CHARS[key], b = c.bbox;
    var k = FILL * d / (b[3] - b[1] + 1);
    return { w:c.size[0]*k, h:c.size[1]*k,
             x:-((b[0]+b[2]+1)/2)*k, y:-((b[1]+b[3]+1)/2)*k };
  }

  (function(){
    var fig = fitFigure(LESSON, D * INNER);
    var fi = document.getElementById("figureImg");
    fi.setAttribute("href", CHAR_IMG);
    fi.setAttribute("width",  fig.w);
    fi.setAttribute("height", fig.h);
    fi.setAttribute("x", fig.x);
    fi.setAttribute("y", fig.y);
    document.querySelector("#ringClip circle").setAttribute("r", RI);
    document.querySelector("#ringClipBig circle").setAttribute("r", RI * WHOLE_SCALE);
    document.getElementById("clefImg").setAttribute("href", STAFF_IMG);
  })();

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* mark a step as taken, without ever taking it out of service */
  function markDone(id){
    var b = document.getElementById(id);
    if(b && !b.classList.contains("done")){ b.classList.add("done"); saveState(); }
  }
  function clearDone(){
    ["btnSong","btnVideo","btnReveal","btnClick","btnPiano","btnDraw","btnPlay"]
      .forEach(function(id){
        var b = document.getElementById(id);
        if(b){ b.classList.remove("done"); }
      });
  }
  var step = 0, bpmMs = 1000, timer = null, beat = -1, beatLeft = 0;   /* 60 · 80 · 100 BPM */
  var noteEls = [], vbW = 1920, xs = [], centerX = 1200, maxSlots = 6;
  var gameX = 900, ghostX = 1500;   /* the middle of each measure */
  var countTimer = null;
  var countEl = document.getElementById("count");

  function svg(tag, attrs){
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for(var k in attrs){ el.setAttribute(k, attrs[k]); }
    return el;
  }

  /* ---- the staff stretches to whatever width the projector gives us ---- */
  function layout(){
    var w = stage.clientWidth, h = stage.clientHeight;
    if(!w || !h) return;
    vbW = Math.max(1400, Math.round(1080 * (w / h)));
    staff.setAttribute("viewBox", "0 0 " + vbW + " 1080");

    gLines.innerHTML = "";
    guideLines.innerHTML = "";
    numsEl.innerHTML = "";
    /* built bottom to top: the lowest line is line 1 */
    for(var q = 0; q < LINES.length; q++){
      var num = svg("text", {x:50, y:LINES[LINES.length - 1 - q]});
      num.textContent = String(q + 1);
      numsEl.appendChild(num);
    }
    numsShown = false;
    LINES.forEach(function(y){
      var ln = svg("line", {"class":"staff-line", x1:0, y1:y, x2:vbW, y2:y});
      ln.style.setProperty("--w", vbW);
      gLines.appendChild(ln);
      guideLines.appendChild(svg("line", {x1:0, y1:y, x2:vbW, y2:y}));
    });

    var first = CLEF_RIGHT + 160;
    var last  = vbW - 120;
    var span  = last - first;
    /* slots never move once chosen, so adding a note never shifts the ones before it */
    maxSlots = Math.max(2, Math.min(MAXN, Math.floor(span / (D * 1.35)) + 1));
    xs = [];
    for(var i = 0; i < maxSlots; i++){ xs.push(first + (span / (maxSlots - 1)) * i); }
    centerX = first + span / 2;
    countEl.setAttribute("x", centerX);

    /* halfway along the row: with eight places that is four beats a measure */
    var bar = document.getElementById("barline");
    if(maxSlots >= 2){
      var mid = Math.floor(maxSlots / 2);
      var barX = (xs[mid - 1] + xs[mid]) / 2;
      bar.setAttribute("x1", barX);
      bar.setAttribute("x2", barX);
      bar.setAttribute("y1", LINES[0]);
      bar.setAttribute("y2", LINES[4]);
      bar.style.display = "";
      /* clear of the bar line, one note to a measure */
      gameX  = (xs[0] + xs[mid - 1]) / 2;
      ghostX = (xs[mid] + xs[maxSlots - 1]) / 2;
    } else {
      bar.style.display = "none";
      gameX = centerX;
      ghostX = centerX;
    }

    noteEls.forEach(function(el, i){
      var x = xs[Math.min(i, xs.length - 1)];
      el.setAttribute("transform", "translate(" + x + "," + STEP_Y[el.dataset.note] + ")");
    });
    if(app.dataset.piano === "1"){ drawWire(); }
  }

  /* ---------------- audio ---------------- */
  var ac = null, master = null, noiseBuf = null;
  function audio(){
    if(!ac){
      ac = new (window.AudioContext || window.webkitAudioContext)();
      /* run the page hot into a limiter: loud over classroom noise,
         but peaks are caught so projector speakers never crackle */
      var comp = ac.createDynamicsCompressor();
      comp.threshold.value = -9;
      comp.knee.value = 6;
      comp.ratio.value = 14;
      comp.attack.value = 0.002;
      comp.release.value = 0.12;
      master = ac.createGain();
      master.gain.value = 3.4;
      master.connect(comp);
      var pre = ac.createGain();
      pre.gain.value = 0.5;
      var round = ac.createWaveShaper();
      var curve = new Float32Array(2048);
      for(var q = 0; q < curve.length; q++){
        var x = (q / (curve.length - 1)) * 2 - 1;
        curve[q] = Math.tanh(2 * x);        /* straight for normal levels, bending only near the top */
      }
      round.curve = curve;
      round.oversample = "4x";
      comp.connect(pre); pre.connect(round); round.connect(ac.destination);

      var len = Math.floor(ac.sampleRate * 0.05);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      var dd = noiseBuf.getChannelData(0);
      for(var i = 0; i < len; i++){ dd[i] = (Math.random() * 2 - 1) * (1 - i / len); }
    }
    if(ac.state === "suspended"){ ac.resume(); }
    return ac;
  }
  function tick(accent){
    var c = audio(), t = c.currentTime;

    /* a noise transient is what actually cuts through a room full of children */
    var src = c.createBufferSource(); src.buffer = noiseBuf;
    var bp = c.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = accent ? 3200 : 2300;
    bp.Q.value = 1.1;
    var ng = c.createGain();
    ng.gain.setValueAtTime(accent ? 1.0 : 0.72, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    src.connect(bp); bp.connect(ng); ng.connect(master);
    src.start(t); src.stop(t + 0.06);

    /* a pitched blip on top gives the beat a clear centre */
    var o = c.createOscillator(), g = c.createGain();
    o.type = "square";
    o.frequency.value = accent ? 1800 : 1300;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(accent ? 0.9 : 0.6, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.08);
  }
  function pianoVoice(freq){
    var c = audio(), t = c.currentTime;
    /* an electric piano: one sine bent by another, the bend fading fast.
       warm and bell-like, and it stays pleasant over many repetitions. */
    var out = c.createGain();
    out.connect(master);
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(1.9, t + 0.015);   /* loud on purpose: a noisy room */
    out.gain.setTargetAtTime(0.0001, t + 0.02, 1.5);         /* it fades by itself, like a struck tine */

    var car = c.createOscillator(), mod = c.createOscillator(), idx = c.createGain();
    car.type = "sine"; mod.type = "sine";
    car.frequency.value = freq;
    mod.frequency.value = freq;
    idx.gain.setValueAtTime(freq * 1.1, t);
    idx.gain.setTargetAtTime(freq * 0.12, t, 0.35);          /* the bell lives only at the front of the note */
    mod.connect(idx);
    idx.connect(car.frequency);

    var lp = c.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 2600; lp.Q.value = 0.4;
    car.connect(lp);
    lp.connect(out);

    car.start(t); mod.start(t);
    var oscs = [car, mod];


    return {
      stop: function(){
        var s = c.currentTime;
        try{
          out.gain.cancelScheduledValues(s);
          out.gain.setValueAtTime(Math.max(out.gain.value, 0.0001), s);
          out.gain.setTargetAtTime(0, s, 0.07);
        }catch(err){}
        oscs.forEach(function(o){ try{ o.stop(s + 0.5); }catch(err){} });
      }
    };
  }

  /* a note of a set length: clicker, landing, games, the other keys */
  function tone(freq, dur){
    var v = pianoVoice(freq);
    setTimeout(v.stop, (dur || 1.4) * 1000);
  }

  /* ---------------- holding a note for exactly one beat ----------------
     The water-fill idea comes from sol-shiur-piano: the level rises while the
     key is held and a chime says when to let go. Here the fill lasts one whole
     beat at the chosen tempo, because one beat is what a quarter note means. */
  var HOLD_TOL = 0.90;
  var HOLD_FRACTION = 0.75;   /* how much of its value a note sounds, everywhere: piano, clicker, landing, games */
  var hold = null, heldTone = null, keyFillEl = null, targetKeyEl = null;
  var playIdx = 0;      /* which note in the row the piano is waiting for */

  /* The line is driven frame by frame rather than by a CSS transition, so it
     lands on each note exactly when that note sounds, at any tempo. */
  var headEl = document.getElementById("playhead");
  var ph = {from:0, to:0, t0:0, dur:0, raf:0, on:false};

  function phAt(x){ headEl.setAttribute("transform", "translate(" + x + ",0)"); }
  function phTick(){
    if(!ph.on){ ph.raf = 0; return; }
    var q = Math.min(1, (Date.now() - ph.t0) / Math.max(1, ph.dur || bpmMs));
    phAt(ph.from + (ph.to - ph.from) * q);
    ph.raf = requestAnimationFrame(phTick);
  }
  function phGlide(fromX, toX, ms){
    ph.from = fromX; ph.to = toX; ph.t0 = Date.now(); ph.dur = ms || bpmMs;
    phAt(fromX);
    if(!ph.raf){ ph.raf = requestAnimationFrame(phTick); }
  }
  function phShow(on){
    ph.on = on;
    headEl.style.opacity = on ? "1" : "0";
    if(on){ if(!ph.raf){ ph.raf = requestAnimationFrame(phTick); } }
    else if(ph.raf){ cancelAnimationFrame(ph.raf); ph.raf = 0; }
  }

  function markNext(){
    var on = app.dataset.piano === "1" && noteEls.length > 1 && pianoMode === "play";
    noteEls.forEach(function(el, i){ el.classList.toggle("next", on && i === playIdx); });
  }
  var runDone = false;

  function paintKbTip(){
    var tip = document.getElementById("kbTip");
    var again = document.getElementById("btnAgain");
    if(!tip){ return; }
    if(pianoMode === "write"){
      tip.textContent = "לַחֲצוּ עַל " + NOTES[LESSON].he + ": קָצָר — רֶבַע · עַד הַצְּלִיל הַשֵּׁנִי — שָׁלֵם";
      again.classList.remove("show");
      return;
    }
    if(runDone){
      tip.textContent = "סִיַּמְתֶּם אֶת כָּל הַשּׁוּרָה";
      again.classList.add("show");
    } else {
      var b = beatsOf(placed[Math.min(playIdx, Math.max(0, placed.length - 1))]);
      var howLong = b === 4 ? "אַרְבַּע פְּעִימוֹת" : b === 2 ? "שְׁתֵּי פְּעִימוֹת" : "פְּעִימָה אַחַת";
      tip.textContent = noteEls.length > 1
        ? "נַגְּנוּ אֶת הַתָּוִים בָּזֶה אַחַר זֶה — עִזְבוּ כְּשֶׁתִּשְׁמְעוּ אֶת הַצְּלִיל"
        : "לַחֲצוּ עַל " + NOTES[LESSON].he + " וְהַחֲזִיקוּ " + howLong;
      again.classList.remove("show");
    }
  }

  function resetRun(){
    playIdx = 0;
    runDone = false;
    markNext();
    paintKbTip();
  }

  function startTone(freq){
    heldTone = pianoVoice(freq);
  }

  function stopTone(){
    if(!heldTone){ return; }
    heldTone.stop();
    heldTone = null;
  }

  /* the sound of "not that one" — low, short, unmistakable, never harsh */
  function buzz(){
    var c = audio(), t = c.currentTime;
    [233, 175].forEach(function(fq, i){
      var o = c.createOscillator(), g = c.createGain();
      o.type = "square";
      o.frequency.value = fq;
      var t0 = t + i * 0.14;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.17);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + 0.22);
    });
  }

  function chime(){
    var c = audio(), t = c.currentTime;
    var o = c.createOscillator(), g = c.createGain();
    o.type = "sine";
    o.frequency.value = 2093;               /* C7, well clear of the note itself */
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.85, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.45);
  }

  function setWater(el, p){
    if(!el){ return; }
    el.dataset.p = p;
    var y = RI - 2 * RI * p;
    var w = el.querySelector(".water"), s = el.querySelector(".water-top");
    if(w){ w.setAttribute("y", y); }
    if(s){ s.setAttribute("y", y); }
  }

  function drainWater(el){
    if(!el){ return; }
    var p0 = Number(el.dataset.p || 0), t0 = Date.now();
    (function step(){
      var q = Math.min(1, (Date.now() - t0) / 420);
      setWater(el, p0 * (1 - q));
      if(q < 1){ requestAnimationFrame(step); }
    })();
  }

  var pianoMode = "write";    /* "write": the piano writes onto the staff. "play": it plays the row */

  /* a second, brighter chime: held this far, it is a whole */
  function chimeWhole(){
    var c = audio(), t = c.currentTime;
    [2093, 2637].forEach(function(fq, k){
      var o = c.createOscillator(), g = c.createGain(), t0 = t + k * 0.12;
      o.type = "sine";
      o.frequency.value = fq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.8, t0 + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + 0.45);
    });
  }

  function startWrite(){
    if(placed.length >= maxSlots){ flash("הַחַמְשָׁה מְלֵאָה"); return; }
    audio();
    hold = {write:true, t0:Date.now(), raf:0, qDone:false, wDone:false,
            qNeed: bpmMs * HOLD_FRACTION,         /* a quarter, at the one length the page uses */
            wNeed: bpmMs * 4 * HOLD_FRACTION};    /* and a whole */
    startTone(NOTES[LESSON].freq);
    tickWrite();
  }

  function tickWrite(){
    if(!hold || !hold.write){ return; }
    var t = Date.now() - hold.t0;
    if(keyFillEl){ keyFillEl.style.height = (Math.min(1, t / hold.wNeed) * 100).toFixed(1) + "%"; }
    var tip = document.getElementById("kbTip");
    /* the quarter point is marked in words only: a chime here lands in the middle of
       holding a whole, and on a laptop speaker it sounds like something broke */
    if(t >= hold.qNeed && !hold.qDone){ hold.qDone = true; tip.textContent = "רֶבַע"; }
    if(t >= hold.wNeed && !hold.wDone){ hold.wDone = true; chimeWhole(); tip.textContent = "שָׁלֵם"; }
    hold.raf = requestAnimationFrame(tickWrite);
  }

  function endWrite(){
    var e = hold; hold = null;
    cancelAnimationFrame(e.raf);
    stopTone();
    if(keyFillEl){ keyFillEl.style.height = "0%"; }
    addNote(e.wDone ? "whole" : "quarter", true);   /* already heard it, no second sound */
    paintKbTip();
  }

  function setPianoMode(m){
    if(hold){ endHold(); }
    pianoMode = m;
    Array.prototype.forEach.call(document.querySelectorAll(".kbmode button"), function(b){
      b.setAttribute("aria-pressed", b.dataset.pm === m ? "true" : "false");
    });
    resetRun();
    drawWire();
    saveState();
  }

  function startHold(){
    if(hold){ return; }
    if(pianoMode === "write"){ startWrite(); return; }
    if(!noteEls.length){ tone(NOTES[LESSON].freq, 0.9); return; }
    if(runDone){
      /* the line is finished; the key still answers, it just does not restart */
      tone(NOTES[LESSON].freq, 0.9);
      return;
    }
    audio();
    if(playIdx >= noteEls.length){ playIdx = 0; }
    var b = beatsOf(placed[playIdx]);
    /* every value is held for the same share of its length: 0.75 of a quarter, 0.75 of a whole */
    var need = bpmMs * b * HOLD_FRACTION;   /* every value is held for 0.75 of its length */
    hold = {t0:Date.now(), need:need, el:noteEls[playIdx], full:false, raf:0};
    startTone(NOTES[LESSON].freq);
    tickHold();
  }

  function tickHold(){
    if(!hold){ return; }
    var p = Math.min(1, (Date.now() - hold.t0) / hold.need);
    setWater(hold.el, p);
    if(keyFillEl){ keyFillEl.style.height = (p * 100).toFixed(1) + "%"; }
    if(p >= 1 && !hold.full){
      hold.full = true;
      hold.el.classList.add("hold-full");
      chime();                              /* this is the signal to let go */
    }
    hold.raf = requestAnimationFrame(tickHold);
  }

  function endHold(){
    if(!hold){ return; }
    if(hold.write){ endWrite(); return; }
    var e = hold; hold = null;
    cancelAnimationFrame(e.raf);
    stopTone();
    var p = Math.min(1, (Date.now() - e.t0) / e.need);
    e.el.classList.remove("hold-full");
    if(keyFillEl){ keyFillEl.style.height = "0%"; }
    if(p >= HOLD_TOL){
      e.el.classList.add("beat");           /* the ring confirms: that was one beat */
      setTimeout(function(){ e.el.classList.remove("beat"); }, 520);
      playIdx++;
      if(playIdx >= noteEls.length){
        /* the whole line has been played. It stops here — going straight back
           to the first note would just repeat the line without anyone asking. */
        runDone = true;
        paintKbTip();
        if(targetKeyEl){
          var again = targetKeyEl.classList.contains("earned");
          targetKeyEl.classList.add("earned");
          if(again){
            targetKeyEl.classList.remove("again");
            void targetKeyEl.offsetWidth;
            targetKeyEl.classList.add("again");
          }
        }
      }
      markNext();
      drawWire();
    }
    drainWater(e.el);
  }

  /* ---------------- notes on the staff ---------------- */
  function buildNote(key, x, dur){
    dur = dur || "quarter";
    var s  = (dur === "whole") ? WHOLE_SCALE : 1;   /* a long note is a large note */
    var r  = R * s;
    var ri = RI * s;

    var g = svg("g", {"class":"note", "transform":"translate(" + x + "," + STEP_Y[key] + ")"});
    g.dataset.note = key;
    g.dataset.dur  = dur;
    var drop  = svg("g", {"class":"drop"});
    var pulse = svg("g", {"class":"pulse"});

    if(LEDGER[key]){
      pulse.appendChild(svg("line", {"class":"ledger", x1:-(r+45), y1:0, x2:(r+45), y2:0}));
    }

    /* stem first, so the head is drawn over the join */
    if(dur !== "whole"){
      var up = STEP_Y[key] > MIDDLE;              /* below the middle line → stem up on the right */
      var sx = up ? (r - 8) : -(r - 8);
      pulse.appendChild(svg("line", {"class":"stem",
        x1:sx, y1:0, x2:sx, y2: up ? -STEM_LEN : STEM_LEN}));
    }
    pulse.appendChild(svg("circle", {"class":"halo", r:r}));
    pulse.appendChild(svg("circle", {"class":"rim", r:r}));
    pulse.appendChild(svg("circle", {"class":"inner", r:ri}));

    var clip = svg("g", {"class":"face",
      "clip-path": s === 1 ? "url(#ringClip)" : "url(#ringClipBig)"});
    /* the figure and the water live in their own space, scaled with the head,
       so setWater can keep working in the numbers it already knows */
    var inside = svg("g", s === 1 ? {} : {transform:"scale(" + s + ")"});
    inside.appendChild(svg("use", {href:"#figure"}));
    inside.appendChild(svg("rect", {"class":"water",     x:-RI, y:RI, width:RI*2, height:RI*2.2}));
    inside.appendChild(svg("rect", {"class":"water-top", x:-RI, y:RI, width:RI*2, height:9}));
    clip.appendChild(inside);
    pulse.appendChild(clip);

    /* struck out when this is not the note we were looking for */
    var xm = svg("g", {"class":"xmark"});
    xm.appendChild(svg("line", {x1:-r * 0.82, y1:-r * 0.82, x2: r * 0.82, y2: r * 0.82}));
    xm.appendChild(svg("line", {x1: r * 0.82, y1:-r * 0.82, x2:-r * 0.82, y2: r * 0.82}));
    pulse.appendChild(xm);

    drop.appendChild(pulse);
    g.appendChild(drop);
    return g;
  }

  /* each press puts the next note down, left to right, the way music is read */
  function addNote(value, silent){
    /* a button click passes an event here, so only a string counts as a value */
    var v = (typeof value === "string") ? value : DUR;
    if(placed.length >= maxSlots){ flash("הַחַמְשָׁה מְלֵאָה"); return; }
    var key = LESSON, i = placed.length;
    placed.push({key:key, dur:v});
    var g = buildNote(key, xs[i], v);
    gNotes.appendChild(g);
    noteEls.push(g);
    void g.getBBox();
    requestAnimationFrame(function(){ g.classList.add("on"); });
    /* every note is heard as it arrives, at its real length. Only a note written
       from the piano stays quiet here, because it was just heard under the finger */
    if(!silent){ tone(NOTES[key].freq, Math.min(4.2, beatsOf({dur:v}) * bpmMs / 1000 * HOLD_FRACTION)); }
    headline.textContent = NOTES[key].he;
    btnReveal.textContent = "הוֹסָפַת הַתָּו";
    markDone("btnReveal");
    saveState();
    setStep(1);
    resetRun();
    if(app.dataset.piano === "1"){ drawWire(); }
  }

  /* ---------------- choosing a note and deleting it ---------------- */
  var selIdx = -1;

  function clearSelection(){
    noteEls.forEach(function(el){
      el.classList.remove("selected");
      var b = el.querySelector(".delbadge");
      if(b){ b.parentNode.removeChild(b); }
    });
    selIdx = -1;
  }

  function selectNote(i){
    var again = !!(noteEls[i] && noteEls[i].classList.contains("selected"));
    clearSelection();
    if(again || i < 0){ return; }          /* a second press lets go of it */
    var el = noteEls[i];
    if(!el){ return; }
    selIdx = i;
    el.classList.add("selected");
    var r = R * (el.dataset.dur === "whole" ? WHOLE_SCALE : 1);
    /* top left of the head, clear of a stem that rises on the right */
    var badge = svg("g", {"class":"delbadge", transform:"translate(" + (-r * 0.8) + "," + (-r * 0.8) + ")"});
    badge.appendChild(svg("circle", {r:34}));
    badge.appendChild(svg("line", {x1:-12, y1:-12, x2:12, y2:12}));
    badge.appendChild(svg("line", {x1:12, y1:-12, x2:-12, y2:12}));
    el.querySelector(".pulse").appendChild(badge);
  }

  /* after any deletion: close the gaps, and put the lesson back in order */
  function afterNotesChanged(){
    noteEls.forEach(function(el, i){
      el.setAttribute("transform", "translate(" + xs[i] + "," + STEP_Y[el.dataset.note] + ")");
    });
    if(!placed.length){
      closePiano();
      headline.textContent = "מִי מַגִּיעַ לַחַמְשָׁה?";
      btnReveal.textContent = "מִי הַתָּו הֶחָדָשׁ?";
      setStep(0);
    }
    resetRun();
    if(app.dataset.piano === "1"){ drawWire(); }
    saveState();
  }

  function deleteNote(i){
    if(i < 0 || i >= noteEls.length){ return; }
    stopClicker();
    clearSelection();
    var g = noteEls.splice(i, 1)[0];
    placed.splice(i, 1);
    if(g && g.parentNode){ g.parentNode.removeChild(g); }
    afterNotesChanged();
  }

  function clearAllNotes(){
    stopClicker();
    clearSelection();
    gNotes.innerHTML = "";
    noteEls = [];
    while(placed.length){ placed.pop(); }
    afterNotesChanged();
  }

  document.getElementById("btnClear").addEventListener("click", clearAllNotes);

  /* one listener for every note on the staff, in the ordinary lesson only */
  gNotes.addEventListener("pointerdown", function(e){
    if(inGame() || inDraw()){ return; }
    var badge = e.target.closest ? e.target.closest(".delbadge") : null;
    if(badge){
      e.preventDefault(); e.stopPropagation();
      deleteNote(noteEls.indexOf(badge.closest(".note")));
      return;
    }
    var note = e.target.closest ? e.target.closest(".note") : null;
    if(!note || note.classList.contains("plain") || note.classList.contains("trace")){ return; }
    e.preventDefault();
    selectNote(noteEls.indexOf(note));
  });

  function removeNote(){
    clearSelection();
    if(!placed.length){ return; }
    placed.pop();
    var g = noteEls.pop();
    g.classList.remove("on");
    setTimeout(function(){ if(g.parentNode){ g.parentNode.removeChild(g); } }, 320);
    if(beat >= noteEls.length){ beat = noteEls.length - 1; }
    resetRun();
    saveState();
    if(!placed.length){
      stopClicker();
      closePiano();
      headline.textContent = "מִי מַגִּיעַ לַחַמְשָׁה?";
      btnReveal.textContent = "מִי הַתָּו הֶחָדָשׁ?";
      setStep(0);
    }
  }

  /* the same note, drawn as a tracing sheet */
  function buildTraceNote(key, x){
    var g = svg("g", {"class":"note trace", "transform":"translate(" + x + "," + STEP_Y[key] + ")"});
    g.dataset.note = key;
    var up  = STEP_Y[key] > MIDDLE;
    var sx  = up ? (R - 8) : -(R - 8);
    var sy2 = up ? -STEM_LEN : STEM_LEN;
    var lx  = R + 45;

    if(LEDGER[key]){ g.appendChild(svg("line", {"class":"tpl", x1:-lx, y1:0, x2:lx, y2:0})); }
    g.appendChild(svg("circle", {"class":"tpl", r:R}));
    g.appendChild(svg("line", {"class":"tpl", x1:sx, y1:0, x2:sx, y2:sy2}));

    g.appendChild(svg("circle", {"class":"ink head", r:R}));
    if(LEDGER[key]){ g.appendChild(svg("line", {"class":"ink ledger", x1:-lx, y1:0, x2:lx, y2:0})); }
    g.appendChild(svg("line", {"class":"ink stem", x1:sx, y1:0, x2:sx, y2:sy2}));
    g.appendChild(svg("circle", {"class":"solidfill", r:R}));
    return g;
  }

  /* ---------------- clicker ---------------- */
  function startClicker(){
    stopMusic();
    /* pressed on an empty staff: put the note down rather than refuse */
    if(!placed.length){ addNote(); }
    if(!placed.length){ return; }
    audio();
    markDone("btnClick");
    btnClick.textContent = "עֲצִירָה";
    btnClick.classList.remove("dim");
    btnClick.classList.add("live");

    var stepBeat = function(){
      /* a whole note keeps the pulse for four beats before anything moves on */
      if(beat >= 0 && beatLeft > 0){
        beatLeft--;
        tick(false);
        return;
      }
      if(beat >= 0 && noteEls[beat]){ noteEls[beat].classList.remove("beat"); }
      beat++;
      if(beat >= noteEls.length){
        /* the row has been read once through — stop rather than loop */
        stopClicker();
        return;
      }
      var b = beatsOf(placed[beat]);
      beatLeft = b - 1;
      if(noteEls[beat]){ noteEls[beat].classList.add("beat"); }
      var gap = xs.length > 1 ? (xs[1] - xs[0]) : 200;
      phGlide(xs[beat],
              beat + 1 < noteEls.length ? xs[beat + 1] : xs[beat] + gap,
              b * bpmMs);
      tick(beat === 0);
      /* the click and the note sound together, for as long as the note lasts */
      if(placed[beat]){ tone(NOTES[placed[beat].key].freq, Math.min(3.6, b * bpmMs / 1000 * HOLD_FRACTION)); }
    };
    var run = function(){
      beat = -1;
      beatLeft = 0;
      stepBeat();                       /* first note lands on the beat after "4" */
      timer = setInterval(stepBeat, bpmMs);
    };

    countIn(run);
  }

  /* four beats of preparation, heard and seen, before the notes start */
  function countIn(done){
    if(xs.length){ phAt(xs[0]); }
    phShow(true);
    var n = 0;
    var fire = function(){
      n++;
      if(n <= 4){ showCount(n); tick(n === 1); }
      else {
        clearInterval(countTimer); countTimer = null;
        hideCount();
        done();
      }
    };
    fire();
    countTimer = setInterval(fire, bpmMs);
  }

  function showCount(n){
    countEl.textContent = String(n);
    countEl.classList.add("on");
    countEl.classList.remove("pop");
    void countEl.getBBox();
    countEl.classList.add("pop");
  }
  function hideCount(){
    countEl.classList.remove("on", "pop");
    countEl.textContent = "";
  }

  function stopClicker(){
    if(timer){ clearInterval(timer); timer = null; }
    if(countTimer){ clearInterval(countTimer); countTimer = null; }
    hideCount();
    phShow(false);
    noteEls.forEach(function(el){ el.classList.remove("beat"); });
    beat = -1;
    btnClick.textContent = "קְלִיקֶר";
    btnClick.classList.remove("live");
  }
  function running(){ return Boolean(timer || countTimer); }
  function toggleClicker(){ if(running()){ stopClicker(); } else { startClicker(); } }

  /* ---------------- piano ---------------- */
  function buildKeyboard(){
    kb.innerHTML = "";
    var whites = document.createElement("div");
    whites.className = "whites";

    ORDER.forEach(function(key){
      var n = NOTES[key];
      var k = document.createElement("button");
      k.type = "button";
      k.className = "wkey" + (key === LESSON ? " target" : "");
      k.setAttribute("aria-label", n.he);

      if(key === LESSON){
        keyFillEl = document.createElement("div");
        keyFillEl.className = "key-fill";
        k.appendChild(keyFillEl);

        var c = document.createElement("div");
        c.className = "charc";
        c.style.setProperty("--d", "clamp(40px, 9vh, 86px)");
        var img = document.createElement("img");
        img.src = CHAR_IMG;
        img.alt = "";
        var fr = fitFigure(LESSON, 1);
        img.style.width  = "calc(var(--d) * " + fr.w + ")";
        img.style.height = "calc(var(--d) * " + fr.h + ")";
        img.style.left   = "calc(var(--d) * " + (fr.x + 0.5) + ")";
        img.style.top    = "calc(var(--d) * " + (fr.y + 0.5) + ")";
        c.appendChild(img);
        k.appendChild(c);
      }

      var nm = document.createElement("span");
      nm.className = "kname";
      nm.textContent = n.he;
      k.appendChild(nm);

      if(key === LESSON){
        var star = svg("svg", {"class":"star", viewBox:"0 0 24 24", "aria-hidden":"true"});
        star.appendChild(svg("path", {d:
          "M12 1 L14.82 8.12 L22.46 8.60 L16.57 13.48 L18.47 20.90 " +
          "L12 16.80 L5.53 20.90 L7.43 13.48 L1.54 8.60 L9.18 8.12 Z"}));
        k.appendChild(star);
        targetKeyEl = k;
      }

      if(key === LESSON){
        /* press and hold: the head fills, the chime says when to release */
        var release = function(e){
          if(e && e.cancelable){ e.preventDefault(); }
          k.classList.remove("down");
          endHold();
        };
        k.addEventListener("pointerdown", function(e){
          e.preventDefault();
          k.classList.add("down");
          startHold();
        });
        k.addEventListener("pointerup", release);
        k.addEventListener("pointercancel", release);
        k.addEventListener("pointerleave", release);
        /* a finger resting on a key is what makes Safari zoom — block it at the source */
        k.addEventListener("touchstart", function(e){ if(e.cancelable){ e.preventDefault(); } }, {passive:false});
        k.addEventListener("touchend", release, {passive:false});
        k.addEventListener("touchcancel", release, {passive:false});
      } else {
        k.addEventListener("pointerdown", function(e){
          e.preventDefault();
          tone(n.freq);
          k.classList.add("down");
          setTimeout(function(){ k.classList.remove("down"); }, 150);
        });
      }

      whites.appendChild(k);
    });

    kb.appendChild(whites);
    paintKbTip();

    var w = 100 / 7;
    /* the white key each black key follows, and the pitch it carries */
    [[0, 277.18], [1, 311.13], [3, 369.99], [4, 415.30], [5, 466.16]].forEach(function(pair){
      var i = pair[0], freq = pair[1];
      var b = document.createElement("div");
      b.className = "bkey";
      b.style.width = (w * 0.58) + "%";
      b.style.left = ((i + 1) * w - w * 0.29) + "%";
      var press = function(e){
        if(e && e.cancelable){ e.preventDefault(); }
        tone(freq, 0.9);
        b.classList.add("down");
        setTimeout(function(){ b.classList.remove("down"); }, 160);
      };
      b.addEventListener("pointerdown", press);
      b.addEventListener("touchstart", function(e){ if(e.cancelable){ e.preventDefault(); } },
                         {passive:false});
      kb.appendChild(b);
    });
  }

  function drawWire(){
    var target = kb.querySelector(".wkey.target");
    /* nothing is waiting once the row is finished, so nothing is pointed at */
    var head = (pianoMode === "play" && !runDone && playIdx < noteEls.length) ? noteEls[playIdx] : null;
    var path = wire.querySelector("path");
    if(!target || !head || app.dataset.piano !== "1"){
      wire.classList.remove("draw");
      path.setAttribute("d", "");
      return;
    }
    var rim = head.querySelector(".rim");
    if(!rim){ return; }
    var base = wire.getBoundingClientRect();
    var a = rim.getBoundingClientRect();      /* the head alone, never the stem */
    var b = target.getBoundingClientRect();
    var x1 = a.left + a.width / 2 - base.left;
    var y1 = a.bottom - base.top;             /* leave from the bottom of the circle */
    var x2 = b.left + b.width / 2 - base.left;
    var y2 = b.top - base.top;
    path.setAttribute("d",
      "M " + x1 + " " + y1 +
      " C " + x1 + " " + (y1 + (y2 - y1) * 0.55) +
      ", " + x2 + " " + (y1 + (y2 - y1) * 0.45) +
      ", " + x2 + " " + y2);
    var len = path.getTotalLength();
    path.style.setProperty("--len", len);
    wire.classList.remove("draw");
    void path.getBoundingClientRect();
    requestAnimationFrame(function(){ wire.classList.add("draw"); });
  }

  function openPiano(){
    markDone("btnPiano");
    app.dataset.piano = "1";
    btnPiano.textContent = "סְגִירַת הַפְּסַנְתֵּר";
    btnPiano.classList.remove("dim");
    btnPiano.classList.add("live");
    if(step < 3){ setStep(3); }
    resetRun();
    setTimeout(function(){ layout(); drawWire(); }, 540);
  }
  function closePiano(){
    endHold();
    app.dataset.piano = "0";
    btnPiano.textContent = "הַתָּו בַּפְּסַנְתֵּר";
    btnPiano.classList.remove("live");
    btnPiano.classList.add("dim");
    drawWire();
    setTimeout(layout, 540);
  }
  function togglePiano(){ if(app.dataset.piano === "1"){ closePiano(); } else { openPiano(); } }

  /* ---------------- state ---------------- */
  function setStep(s){
    step = s;
    app.dataset.step = String(s);
  }

  var hintT = null;
  function flash(msg){
    hintEl.textContent = msg;
    hintEl.classList.add("show");
    clearTimeout(hintT);
    hintT = setTimeout(function(){ hintEl.classList.remove("show"); }, 2200);
  }

  function advance(){ addNote(); }
  function back(){ removeNote(); }

  /* ---------------- wiring ---------------- */
  btnReveal.addEventListener("click", addNote);
  btnClick.addEventListener("click", toggleClicker);
  btnPiano.addEventListener("click", togglePiano);

  /* which value the next note will be */
  Array.prototype.forEach.call(document.querySelectorAll("#value button"), function(b){
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(document.querySelectorAll("#value button"), function(o){
        o.setAttribute("aria-pressed", "false");
      });
      b.setAttribute("aria-pressed", "true");
      DUR = b.dataset.val;
      paintKbTip();
      saveState();
    });
  });

  /* how fast the beat runs */
  Array.prototype.forEach.call(document.querySelectorAll(".tempo:not(#value) button"), function(b){
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(document.querySelectorAll(".tempo:not(#value) button"), function(o){
        o.setAttribute("aria-pressed", "false");
      });
      b.setAttribute("aria-pressed", "true");
      bpmMs = Number(b.dataset.bpm);
      saveState();
      if(running()){ stopClicker(); startClicker(); }
    });
  });

  document.addEventListener("keydown", function(e){
    if((e.key === "Delete" || e.key === "Backspace") && selIdx >= 0 && !inGame() && !inDraw()){
      e.preventDefault();
      deleteNote(selIdx);
      return;
    }
    if(e.key === "Escape"){
      if(nameBox.classList.contains("open")){ closeNameBox(); }
      else if(hudEl.classList.contains("open")){ hudEl.classList.remove("open"); }
      else if(screenEl.classList.contains("open")){ closeScreen(); }
      return;
    }
    if(nameBox.classList.contains("open")){ return; }
    if(screenEl.classList.contains("open")){ return; }   /* the video owns the keys while it is up */
    if(e.key === "g" || e.key === "G"){ openNameBox(); return; }
    if(inGame()){
      if(e.key === "ArrowLeft" || e.key === "PageDown" || e.key === " "){
        e.preventDefault();
        if(gameId){ nextRound(); }
        return;
      }
      if(e.key === "Enter"){ e.preventDefault(); sendAnswer(); return; }
      return;
    }
    if(inDraw()){
      if(e.key === "ArrowLeft" || e.key === "PageDown" || e.key === " "){ e.preventDefault(); drawNext(); }
      else if(e.key === "ArrowRight" || e.key === "PageUp"){ e.preventDefault(); drawBack(); }
      return;
    }
    if(e.key === " "){ e.preventDefault(); toggleClicker(); }
    else if(e.key === "ArrowLeft" || e.key === "PageDown"){ e.preventDefault(); advance(); }
    else if(e.key === "ArrowRight" || e.key === "PageUp"){ e.preventDefault(); back(); }
    else if(e.key === "v" || e.key === "V"){ openScreen("note"); }
    else if(e.key === "s" || e.key === "S"){ openScreen("song"); }
    else if(e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "p" || e.key === "P"){
      e.preventDefault(); togglePiano();
    }
  });

  /* ---------------- the opening video ---------------- */
  var screenEl = document.getElementById("screen");
  var screenBody = document.getElementById("screenBody");
  var btnVideo = document.getElementById("btnVideo");
  var vid = null;

  var tabsEl = document.getElementById("tabs");
  var group = "note", pick = 0;

  function openScreen(kind, idx){
    group = FILMS[kind] ? kind : "note";
    pick = idx || 0;
    var opener = "btn" + (group === "song" ? "Song" : "Video");
    document.getElementById(opener).classList.remove("hint");   /* it has done its job */
    markDone(opener);
    stopClicker();
    closeNameBox();
    paintTabs();
    playFilm();
    screenEl.classList.add("open");
    document.getElementById("btnClose").focus();
  }

  function paintTabs(){
    tabsEl.innerHTML = "";
    var list = FILMS[group];
    if(list.length < 2){ return; }              /* one film needs no chooser */
    list.forEach(function(film, i){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = film.name;
      b.setAttribute("aria-pressed", i === pick ? "true" : "false");
      b.addEventListener("click", function(){
        if(i === pick){ return; }
        pick = i;
        paintTabs();
        playFilm();
      });
      tabsEl.appendChild(b);
    });
  }

  var frameEl = screenEl.querySelector(".frame");

  /* give the film the largest box on screen that keeps its own proportions,
     whether it is landscape or portrait */
  function fitFrame(){
    if(!vid || !vid.videoWidth || !vid.videoHeight){
      frameEl.classList.remove("sized");
      frameEl.style.width = "";
      frameEl.style.height = "";
      return;
    }
    var pad = 2 * Math.min(48, window.innerHeight * 0.04);
    var tabsH = tabsEl.children.length ? tabsEl.offsetHeight + 12 : 0;
    var maxW = window.innerWidth  * 0.94;
    var maxH = window.innerHeight - pad - tabsH;
    var s = Math.min(maxW / vid.videoWidth, maxH / vid.videoHeight);
    frameEl.classList.add("sized");
    frameEl.style.width  = Math.round(vid.videoWidth  * s) + "px";
    frameEl.style.height = Math.round(vid.videoHeight * s) + "px";
  }

  function playFilm(){
    var film = FILMS[group][pick];
    if(vid){ vid.pause(); }
    screenBody.innerHTML = "";
    frameEl.classList.remove("sized");
    frameEl.style.width = "";
    frameEl.style.height = "";
    if(film.src){
      vid = document.createElement("video");
      vid.src = film.src;
      vid.controls = true;
      vid.playsInline = true;
      vid.addEventListener("loadedmetadata", fitFrame);
      /* a single film closes itself; a group stays open so it can be shown again */
      if(FILMS[group].length < 2){
        vid.addEventListener("ended", function(){ setTimeout(closeScreen, 600); });
      }
      screenBody.appendChild(vid);
      if(group === "song"){
        /* the song and the demonstration start only when she presses play */
        vid.preload = "auto";                  /* so the first frame is showing */
        var big = document.createElement("button");
        big.id = "bigPlay";
        big.type = "button";
        big.setAttribute("aria-label", "הַפְעָלָה");
        big.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5 L20 12 L6 20.5 Z"></path></svg>';
        big.addEventListener("click", function(){ vid.play().catch(function(){}); });
        vid.addEventListener("play",  function(){ big.hidden = true; });
        vid.addEventListener("pause", function(){ big.hidden = false; });
        vid.addEventListener("ended", function(){ big.hidden = false; });
        screenBody.appendChild(big);
      } else {
        vid.play().catch(function(){});
      }
    } else {
      var p = document.createElement("div");
      p.className = "placeholder";
      var b = document.createElement("b");
      b.textContent = film.name;
      var s = document.createElement("span");
      s.textContent = "הקובץ עדיין לא בתיקייה. ברגע שיהיה שם, הוא ינוגן כאן במסך מלא.";
      p.appendChild(b); p.appendChild(s);
      screenBody.appendChild(p);
      vid = null;
    }
  }

  function closeScreen(){
    screenEl.classList.remove("open");
    if(vid){ vid.pause(); }
    screenBody.innerHTML = "";
    tabsEl.innerHTML = "";
    vid = null;
    btnReveal.focus();
  }

  function replayFilm(){
    if(vid){ vid.currentTime = 0; vid.play().catch(function(){}); }
  }

  btnVideo.addEventListener("click", function(){ openScreen("note"); });
  document.getElementById("btnSong").addEventListener("click", function(){ openScreen("song"); });
  document.getElementById("btnClose").addEventListener("click", closeScreen);
  document.getElementById("btnReplay").addEventListener("click", replayFilm);
  screenEl.addEventListener("click", function(e){ if(e.target === screenEl){ closeScreen(); } });

  /* ---------------- the marker ---------------- */
  var markerEl = document.getElementById("marker");
  var numsEl = document.getElementById("lineNums");
  var numsShown = false;

  /* they arrive one after another from the bottom, in counting order */
  function showNums(on){
    numsShown = !!on;
    var t = numsEl.querySelectorAll("text");
    for(var i = 0; i < t.length; i++){
      if(!on){ t[i].classList.remove("on"); continue; }
      (function(el, k){
        setTimeout(function(){ el.classList.add("on"); }, reduce ? 0 : k * 170);
      })(t[i], i);
    }
    var b = document.getElementById("btnNums");
    b.textContent = on ? "לְהַסְתִּיר מִסְפָּרִים" : "מִסְפּוּר הַקַּוִּים";
    b.classList.toggle("dim", !on);
  }
  var guideLines = document.getElementById("guideLines");
  var clefWrapEl = document.getElementById("clefWrap");
  var drawRaf = 0;

  function markerOn(on){ markerEl.classList.toggle("on", !!on); }
  function markerAt(x, y){
    markerEl.setAttribute("transform", "translate(" + x + "," + y + ") rotate(-20)");
  }
  function stopMarker(){
    if(drawRaf){ cancelAnimationFrame(drawRaf); drawRaf = 0; }
    markerOn(false);
  }

  /* The path a hand takes across a treble clef: out from the middle of the
     spiral, up the left side, over the top loop, down through the middle,
     and away into the tail. Built from the clef's own measured box. */
  /* The line a hand takes across a treble clef. Every number here was checked
     by rendering the path to an image and looking at it, not by guesswork:
     the curl is the widest part of the clef and sits on the סול line, the swash
     leaves it at the left and climbs to the tip, and the stem falls straight
     back down through the curl into the tail. */
  function clefPathData(){
    var cx = 250, cy = LINES[3];                  /* LINES[3] is the סול line */
    var d = "", steps = 260, sweep = Math.PI * 2 * 1.75;
    for(var i = 0; i <= steps; i++){
      var t = i / steps;
      var th = -Math.PI / 2 + t * sweep;          /* up over the top, round, away left */
      var r = 38 + t * (150 - 38);                /* an open coil, not a tight snail */
      var x = cx + r * Math.cos(th), y = cy + r * Math.sin(th);
      d += (i ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    d += " C 96 600, 120 480, 170 380"       /* the swash rising left of the curl */
      +  " C 215 290, 265 190, 292 110"      /* on up towards the tip */
      +  " C 312 62, 292 26, 258 44"         /* the rounded tip, curling left */
      +  " C 236 62, 248 110, 250 164"       /* turning back down into the stem */
      +  " C 250 320, 250 480, 250 640"      /* straight down, through the centre of the curl */
      +  " C 250 730, 250 790, 250 838"      /* and on past the staff */
      +  " C 250 906, 222 956, 184 946"      /* the tail, turning left */
      +  " C 150 938, 142 900, 168 886";     /* and the final hook */
    return d;
  }

  var clefDrawing = document.getElementById("clefDrawing");
  var clefInk = document.getElementById("clefInk");
  var clefGuidePath = document.getElementById("clefGuidePath");
  (function(){
    var d = clefPathData();
    clefInk.setAttribute("d", d);
    clefGuidePath.setAttribute("d", d);   /* guide and ink are the very same line */
  })();

  /* step 1 — the five lines, one at a time, starting from the first (the lowest) */
  function runStaffDraw(after){
    var lines = Array.prototype.slice.call(gLines.querySelectorAll("line"));
    if(lines.length < 5){ if(after){ after(); } return; }
    var order = [4, 3, 2, 1, 0];               /* line 1 is the bottom one */
    var DUR = 1050, GAP = 190;   /* slow enough for a seven year old to copy along */
    order.forEach(function(idx, k){
      var el = lines[idx];
      el.style.transitionTimingFunction = "linear";
      el.style.transitionDuration = DUR + "ms";
      el.style.transitionDelay = (k * (DUR + GAP)) + "ms";
      el.style.strokeDashoffset = "0";
    });
    markerOn(true);
    var t0 = Date.now(), total = order.length * (DUR + GAP);
    (function step(){
      var t = Date.now() - t0;
      var k = Math.min(order.length - 1, Math.floor(t / (DUR + GAP)));
      var local = t - k * (DUR + GAP);
      var q = Math.max(0, Math.min(1, local / DUR));
      markerAt(q * vbW, LINES[order[k]]);
      markerOn(local <= DUR);          /* the pen lifts while it moves to the next line */
      if(t < total && inDraw()){ drawRaf = requestAnimationFrame(step); }
      else { stopMarker(); if(after){ after(); } }
    })();
  }
  function resetStaffDraw(instant){
    var els = Array.prototype.slice.call(gLines.querySelectorAll("line"));
    els.forEach(function(el){
      el.style.transitionDuration = "";
      el.style.transitionDelay = "";
      el.style.transitionTimingFunction = "";
      if(instant){ el.style.transition = "none"; }
      el.style.strokeDashoffset = "";
    });
    if(instant){
      try{ void gLines.getBBox(); }catch(err){}
      els.forEach(function(el){ el.style.transition = ""; });
    }
  }

  /* step 2 — the clef, uncovered along the path the marker travels */
  function runClefDraw(after){
    var len = clefInk.getTotalLength();
    clefInk.style.strokeDasharray = len;
    clefInk.style.strokeDashoffset = len;
    clefDrawing.style.display = "block";
    clefDrawing.style.opacity = "1";
    clefWrapEl.style.opacity = "0";
    markerOn(true);

    var SPAN_MS = 5200, t0 = Date.now();
    (function step(){
      var q = Math.min(1, (Date.now() - t0) / SPAN_MS);
      clefInk.style.strokeDashoffset = len * (1 - q);
      var p = clefInk.getPointAtLength(len * q);
      markerAt(p.x, p.y);
      if(q < 1 && inDraw()){ drawRaf = requestAnimationFrame(step); return; }

      stopMarker();
      /* the written line hands over to the printed clef */
      var t1 = Date.now();
      (function handover(){
        var r = Math.min(1, (Date.now() - t1) / 520);
        clefDrawing.style.opacity = String(1 - r);
        clefWrapEl.style.opacity = String(r);
        if(r < 1 && inDraw()){ drawRaf = requestAnimationFrame(handover); }
        else {
          clefDrawing.style.display = "none";
          clefWrapEl.style.opacity = "1";
          if(after){ after(); }
        }
      })();
    })();
  }

  function armClefGuide(){
    var len = clefInk.getTotalLength();
    clefInk.style.strokeDasharray = len;
    clefInk.style.strokeDashoffset = len;
    clefDrawing.style.display = "block";
    clefDrawing.style.opacity = "1";
    clefWrapEl.style.opacity = "0";      /* only the dotted line is showing */
  }
  function clearClefMask(){
    clefDrawing.style.display = "none";
    clefDrawing.style.opacity = "";
    clefWrapEl.style.opacity = "";
  }

  /* puts the tracing sheet back to dots — instantly, and from scratch */
  function resetTrace(){
    gNotes.innerHTML = "";
    noteEls = [];
    var g = buildTraceNote(LESSON, xs[0]);
    g.classList.add("on");
    gNotes.appendChild(g);
    noteEls.push(g);
    traced = false;
  }

  /* ---------------- drawing on the whiteboards ---------------- */
  var btnDraw = document.getElementById("btnDraw");
  var btnStep = document.getElementById("btnStep");
  var btnExit = document.getElementById("btnExit");

  /* quiet music for the minutes the class spends drawing */
  var studyEl = document.getElementById("study");
  var btnMusic = document.getElementById("btnMusic");
  var musicNameEl = document.getElementById("musicName");
  /* all five are CC0 or public domain, checked at the source. The prelude opens
     the list because it lives in דו major, the home of the first note. */
  var MUSIC = [
    {name:"בָּאךְ · פְּרֶלוּד בְּדוֹ מָז'וֹר", file:"bach-prelude"},
    {name:"סָאטִי · ז'ִימְנוֹפֵּדִי מִסְפָּר 1", file:"satie-gymnopedie"},
    {name:"שׁוּמַן · חֲלִימָה",              file:"schumann-traumerei"},
    {name:"דֶּבּוּסִי · חֲלוֹם בְּהָקִיץ",     file:"debussy-reverie"},
    {name:"בָּאךְ · אַרְיָה",                file:"bach-air"}
  ];
  var MUSIC_HOME = "https://hanibarsol.github.io/sol-school/media/music/";

  function stopMusic(){

    btnMusic.setAttribute("aria-label", "הַפְעָלַת מוּזִיקָה");

    stopMusic();
  });
  var drawStage = -1, savedCount = 0, lastStepAt = 0, traced = false;
  var drawn = [false, false, false, false];   /* has each step been demonstrated yet */
  var busy = false;                           /* an animation is running */
  var eyebrow = document.getElementById("eyebrow");
  var EYEBROW_HOME = eyebrow.textContent;
  var STEP_WORD = ["רִאשׁוֹן","שֵׁנִי","שְׁלִישִׁי"];

  var DRAW_STEPS = [
    "הוֹצִיאוּ לוּחַ מָחִיק וְטוּשׁ",
    "צַיְּרוּ חַמְשָׁה",
    "צַיְּרוּ מַפְתֵּחַ סוֹל",
    "צַיְּרוּ אֶת " + NOTES[LESSON].he
  ];

  function enterDraw(){
    markDone("btnDraw");
    stopClicker();
    closePiano();
    drawn = [false, false, false, false];
    busy = false;
    showNums(false);
    resetStaffDraw(true);
    stopMarker();
    savedCount = placed.length;
    while(placed.length){ placed.pop(); }
    gNotes.innerHTML = "";
    noteEls = [];
    /* one model note, in dots, hidden until the last step */
    placed.push({key:LESSON, dur:DUR});
    resetTrace();

    drawStage = 0;
    app.dataset.mode = "draw";
    app.dataset.draw = "0";
    paintStage();
  }

  /* the eyebrow always names which of the three drawing steps we are on,
     so nobody assumes the sequence ended at the clef */
  function paintStage(){
    headline.textContent = DRAW_STEPS[drawStage];
    if(drawStage >= 1 && drawn[drawStage] && !busy){ app.dataset.drawn = "1"; }
    else { delete app.dataset.drawn; }
    if(drawStage <= 0){
      eyebrow.textContent = "מְצַיְּרִים בַּלּוּחַ · מִתְכּוֹנְנִים";
      btnStep.textContent = "מַתְחִילִים";
    } else {
      eyebrow.textContent = "מְצַיְּרִים בַּלּוּחַ · שָׁלָב " + STEP_WORD[drawStage - 1] + " מִתּוֹךְ שְׁלוֹשָׁה";
      btnStep.textContent = !drawn[drawStage] ? "בּוֹאוּ נְצַיֵּר יַחַד"
                          : (drawStage === DRAW_STEPS.length - 1 ? "סִיּוּם" : "הַבָּא");
    }
  }

  function drawNext(){
    if(busy){ return; }

    /* on a step that has not been demonstrated yet, this press demonstrates it */
    if(drawStage >= 1 && !drawn[drawStage]){
      busy = true;
      drawn[drawStage] = true;
      var done = function(){ busy = false; lastStepAt = Date.now(); paintStage(); };
      if(drawStage === 1){ runStaffDraw(done); }
      else if(drawStage === 2){ runClefDraw(done); }
      else {
        traced = true;
        var t = gNotes.querySelector(".trace");
        if(t){ t.classList.add("go"); }
        setTimeout(function(){
          if(inDraw()){ tone(NOTES[LESSON].freq, 1.2); }
          done();
        }, 2300);
      }
      paintStage();
      return;
    }

    if(drawStage >= DRAW_STEPS.length - 1){
      if(Date.now() - lastStepAt < 900){ return; }
      exitDraw();
      return;
    }
    drawStage++;
    lastStepAt = Date.now();
    app.dataset.draw = String(drawStage);
    if(drawStage !== 1){ showNums(false); }
    if(drawStage === 2){ armClefGuide(); }
    paintStage();
  }

  /* put the current step back to its guide, instantly */
  function undoStep(){
    drawn[drawStage] = false;
    if(drawStage === 1){ resetStaffDraw(true); }
    else if(drawStage === 2){ armClefGuide(); }
    else if(drawStage === 3){ resetTrace(); }
  }

  /* show the same drawing again from the beginning */
  function redrawStep(){
    if(busy || drawStage < 1 || !drawn[drawStage]){ return; }
    undoStep();
    paintStage();
    setTimeout(drawNext, 420);   /* a beat on the guide, then the marker sets off */
  }

  function drawBack(){
    if(busy){ return; }
    /* first press undoes the demonstration, so it can be shown again */
    if(drawStage >= 1 && drawn[drawStage]){
      undoStep();
      paintStage();
      return;
    }
    if(drawStage <= 0){ exitDraw(); return; }
    drawStage--;
    app.dataset.draw = String(drawStage);
    paintStage();
  }

  function exitDraw(){
    stopMusic();
    drawStage = -1;
    traced = false;
    busy = false;
    delete app.dataset.drawn;
    showNums(false);
    stopMarker();
    resetStaffDraw(true);
    clearClefMask();
    delete app.dataset.mode;
    delete app.dataset.draw;
    eyebrow.textContent = EYEBROW_HOME;
    /* put the staff back the way the class left it */
    gNotes.innerHTML = "";
    noteEls = [];
    while(placed.length){ placed.pop(); }
    for(var i = 0; i < savedCount; i++){
      placed.push({key:LESSON, dur:DUR});
      var g = buildNote(LESSON, xs[i], DUR);
      g.classList.add("on");
      gNotes.appendChild(g);
      noteEls.push(g);
    }
    if(savedCount){
      headline.textContent = NOTES[LESSON].he;
      setStep(1);
    } else {
      headline.textContent = "מִי מַגִּיעַ לַחַמְשָׁה?";
      btnReveal.textContent = "מִי הַתָּו הֶחָדָשׁ?";
      setStep(0);
    }
  }

  function inDraw(){ return app.dataset.mode === "draw"; }

  btnDraw.addEventListener("click", enterDraw);
  btnStep.addEventListener("click", drawNext);
  document.getElementById("btnRedraw").addEventListener("click", redrawStep);
  document.getElementById("btnNums").addEventListener("click", function(){ showNums(!numsShown); });
  btnExit.addEventListener("click", exitDraw);

  /* ---------------- a good word ---------------- */
  /* Hani's own words, short enough to read across a classroom */
  var PRAISE = ["כָּל הַכָּבוֹד", "יָפֶה מְאוֹד", "נֶהְדָּר"];
  var BURST_COLOURS = ["#43225A","#F2A412","#3B6BB2","#CC3717","#189E8A"];
  var hudEl    = document.getElementById("hud");
  var clefsEl  = document.getElementById("clefs");
  var cheerEl  = document.getElementById("cheer");
  var rosterEl = document.getElementById("roster");
  var burstEl  = hudEl.querySelector(".burst");

  (function buildBurst(){
    for(var i = 0; i < 14; i++){
      var ang = (i / 14) * Math.PI * 2;
      var c = svg("circle", {
        cx: (Math.cos(ang) * 78).toFixed(2),
        cy: (Math.sin(ang) * 78).toFixed(2),
        r: i % 2 ? 7 : 11,
        fill: BURST_COLOURS[i % BURST_COLOURS.length]
      });
      c.style.animationDelay = (i * 0.035) + "s";
      burstEl.appendChild(c);
    }
  })();

  /* a rising major triad — the same notes they are learning to read */
  function cheer(){
    [523.25, 659.25, 783.99].forEach(function(fq, i){
      setTimeout(function(){ tone(fq, 0.9); }, i * 95);
    });
  }

  /* the tokens shrink as they multiply, so twenty still fit in the corner */
  function sizeChips(){
    var base = Math.max(20, Math.min(46, Math.round(window.innerHeight * 0.052)));
    var k = roll.length <= 6 ? 1 : roll.length <= 12 ? 0.8 : roll.length <= 20 ? 0.64 : 0.52;
    hudEl.style.setProperty("--cs", Math.round(base * k) + "px");
  }

  function paintRoll(){
    clefsEl.innerHTML = "";   /* the plus lives outside #clefs, so it survives this */
    roll.forEach(function(who, i){
      var chip = document.createElement("div");
      chip.className = "chip" + (i === roll.length - 1 ? " new" : "");
      chip.title = who || "";
      var s = svg("svg", {"class":"clefIcon", preserveAspectRatio:"xMidYMid meet"});
      var t = svg("text", {x:0, y:0});
      t.textContent = "\uD834\uDD1E";        /* 𝄞 */
      s.appendChild(t);
      chip.appendChild(s);
      clefsEl.appendChild(chip);
    });
    hudEl.classList.toggle("empty", roll.length === 0);
    sizeChips();
    fitClefs();
